<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#213C8F">
  <title>現場報到｜奇美醫院116學年度西醫PGY醫師招募說明會</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4c15 0 28 9 28 26S47 60 30 60 4 48 4 32 17 4 32 4z' fill='%23213C8F'/%3E%3Cpath d='M18 33l10 10 18-20' stroke='%23FFB21C' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --navy: #213C8F; --navy-d: #172B6A; --orange: #FFA319; --red: #F2541B; --yellow: #FFC83D; --green: #1E9E5A;
      --ink: #161616; --ink-2: #4A5060; --muted: #6B7180; --line: #E3E7EF;
      --bg: #F4F6FA; --card: #FFFFFF; --soft: #F6F8FC;
      --font: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      --font-en: "Poppins", var(--font);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.55; min-height: 100vh; }
    [hidden] { display: none !important; }
    button, input { font: inherit; }

    .top { background: var(--navy); color: #fff; border-bottom: 4px solid var(--ink); position: relative; overflow: hidden; }
    .top::before { content: ""; position: absolute; width: 140px; height: 140px; right: -50px; top: -70px; border-radius: 46% 54% 60% 40%; background: var(--orange); }
    .top::after { content: ""; position: absolute; width: 70px; height: 70px; right: 90px; bottom: -48px; border-radius: 58% 42% 40% 60%; background: var(--yellow); }
    .top .in { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 22px 16px; }
    .top h1 { margin: 0; font-size: clamp(1.1rem, 4.6vw, 1.45rem); font-weight: 900; line-height: 1.35; }
    .top h1 small { display: block; font-family: var(--font-en); font-size: .6em; font-weight: 800; letter-spacing: .18em; color: var(--yellow); }
    .top p { margin: 6px 0 0; font-size: .9rem; opacity: .9; }

    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    .card { background: var(--card); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--navy); padding: 24px 20px; }
    .card h2 { margin: 0 0 4px; font-size: 1.25rem; font-weight: 900; }
    .card .hint { margin: 0 0 16px; color: var(--muted); font-size: .92rem; }
    label { display: block; font-weight: 700; margin-bottom: 6px; }
    input[type=text] {
      width: 100%; min-height: 52px; padding: 10px 14px; font-size: 18px; border: 2px solid var(--ink);
      border-radius: 14px; background: var(--soft); margin-bottom: 14px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 8px 18px;
      border-radius: 999px; border: 2px solid var(--ink); background: #fff; color: var(--ink); font-weight: 900; font-size: 1.05rem;
      cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: transform .12s, box-shadow .12s; width: 100%;
    }
    .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .btn:focus-visible, input:focus-visible { outline: 3px dashed var(--red); outline-offset: 2px; }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-navy { background: var(--navy); color: #fff; }
    .btn-link { background: none; border: 0; box-shadow: none; color: var(--navy); text-decoration: underline; min-height: 44px; font-weight: 700; font-size: .95rem; }
    .btn[disabled] { opacity: .6; cursor: progress; }
    .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; display: none; animation: spin .8s linear infinite; }
    .loading .spin { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: var(--red); font-weight: 700; min-height: 1.5em; margin: 12px 0 0; }

    .list { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 12px; }
    .item { border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--soft); }
    .item .nm { font-size: 1.2rem; font-weight: 900; }
    .item .meta { color: var(--ink-2); font-size: .9rem; margin: 2px 0 12px; word-break: break-all; }
    .item .done { color: var(--green); font-weight: 700; margin: 0 0 10px; }

    .ok { text-align: center; }
    .ok .mark { width: 96px; height: 96px; margin: 4px auto 14px; border-radius: 50%; background: var(--green); display: grid; place-items: center; border: 3px solid var(--ink); }
    .ok .mark svg { width: 54px; height: 54px; }
    .ok.again .mark { background: var(--orange); }
    .ok.out .mark { background: var(--navy); }
    .ok .times { display: grid; grid-template-columns: auto auto; justify-content: center; gap: 2px 12px; margin: 6px 0 16px; font-size: 1rem; }
    .ok .times dt { color: var(--muted); text-align: right; }
    .ok .times dd { margin: 0; font-family: var(--font-en); font-weight: 800; text-align: left; }
    .ok #outBtn { margin-bottom: 12px; }
    .ok .err:empty { display: none; }
    .ok .nm { font-size: 1.9rem; font-weight: 900; margin: 0; }
    .ok .st { font-size: 1.15rem; font-weight: 900; margin: 4px 0 2px; }
    .ok .tm { font-family: var(--font-en); color: var(--ink-2); margin: 0 0 14px; }
    .ok .note { background: #FFF6E0; border-radius: 12px; padding: 10px 12px; font-size: .92rem; color: var(--ink-2); margin: 0 0 8px; }

    .help { margin-top: 18px; text-align: center; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <header class="top">
    <div class="in">
      <h1><small>CHECK-IN</small>奇美醫院116學年度西醫PGY醫師招募說明會 現場報到</h1>
      <p>115.11.29（日）13:00 開始報到｜第五醫療大樓5樓國際會議廳</p>
    </div>
  </header>

  <main>
    <!-- 1. 查詢 -->
    <form class="card" id="search">
      <h2>查詢報名資料</h2>
      <p class="hint">請輸入報名時填寫的<b>姓名</b>（需與報名時一模一樣）。</p>
      <label for="q">姓名</label>
      <input type="text" id="q" autocomplete="name" enterkeyhint="search" placeholder="例如：王小明" required>
      <div id="codeBox" hidden>
        <label for="code">報到代碼</label>
        <input type="text" id="code" autocomplete="off" placeholder="請掃描現場 QR Code 或向工作人員詢問">
      </div>
      <button class="btn btn-primary" type="submit" id="searchBtn"><span class="spin" aria-hidden="true"></span>查詢</button>
      <p class="err" id="searchErr" role="alert"></p>
    </form>

    <!-- 2. 選擇 -->
    <section class="card" id="pick" hidden>
      <h2>請確認您的資料</h2>
      <p class="hint" id="pickHint">找到以下報名資料，確認是本人後按「確認報到」。</p>
      <ul class="list" id="list"></ul>
      <p class="err" id="pickErr" role="alert"></p>
      <button class="btn-link btn" type="button" id="back">不是我，重新查詢</button>
    </section>

    <!-- 3. 完成 -->
    <section class="card ok" id="done" hidden>
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <p class="nm" id="okName"></p>
      <p class="st" id="okStatus">報到成功</p>
      <dl class="times">
        <dt>報到時間</dt><dd id="okIn"></dd>
        <dt>簽退時間</dt><dd id="okOut">—</dd>
      </dl>
      <button class="btn btn-navy" type="button" id="outBtn"><span class="spin" aria-hidden="true"></span>簽退</button>
      <p class="err" id="outErr" role="alert"></p>
      <p class="note" id="okNote">活動結束離場時，請回到此頁按「簽退」。</p>
      <button class="btn btn-primary" type="button" id="home" hidden>返回簽到系統</button>
    </section>

    <p class="help">找不到報名資料？請直接洽報到櫃台工作人員。</p>
  </main>

<script>
(function () {
  'use strict';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzPsGT_RZx5qVH4miexVhbPE8MDkn8atbIsWqJs8sDxiihiHGeOj32VxEzeo6YRsof7/exec';
  var CODE_STORE = 'pgy116-checkin-code';
  var DONE_STORE = 'pgy116-checkin-done';

  var $ = function (id) { return document.getElementById(id); };
  var timeFmt = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
  function fmt(t) { var d = new Date(t); return isNaN(d) ? String(t || '') : timeFmt.format(d); }
  function get(store, k) { try { return store.getItem(k); } catch (e) { return null; } }
  function set(store, k, v) { try { v == null ? store.removeItem(k) : store.setItem(k, v); } catch (e) {} }

  // 現場 QR Code 網址帶 ?c=代碼：存起來後從網址列移除
  var params = new URLSearchParams(location.search);
  if (params.get('c')) {
    set(sessionStorage, CODE_STORE, params.get('c'));
    params.delete('c');
    history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : '') + location.hash);
  }
  function code() { return $('code').value.trim() || get(sessionStorage, CODE_STORE) || ''; }

  function post(data) {
    data.code = code();
    return fetch(GAS_URL, { method: 'POST', body: new URLSearchParams(data) })
      .then(function (r) { return r.json(); })
      .catch(function () { throw new Error('網路連線異常，請再試一次'); })
      .then(function (res) {
        if (!res) throw new Error('系統忙碌中，請再試一次');
        if (res.needCode) { $('codeBox').hidden = false; set(sessionStorage, CODE_STORE, null); }
        if (!res.ok) throw new Error(res.error || '系統忙碌中，請再試一次');
        if ($('code').value.trim()) set(sessionStorage, CODE_STORE, $('code').value.trim());
        return res;
      });
  }
  function busy(btn, on) { btn.disabled = on; btn.classList.toggle('loading', on); }
  function show(id) { ['search', 'pick', 'done'].forEach(function (s) { $(s).hidden = s !== id; }); window.scrollTo(0, 0); }

  /* ---------- 查詢 ---------- */
  $('search').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = $('q').value.trim();
    if (!q) return;
    $('searchErr').textContent = '';
    busy($('searchBtn'), true);
    post({ action: 'lookup', q: q }).then(function (res) {
      if (!res.rows.length) {
        $('searchErr').textContent = '查無「' + q + '」的報名資料。請確認姓名是否與報名時一模一樣（含全形／半形、英文大小寫），或洽報到櫃台。';
        return;
      }
      renderList(res.rows);
      show('pick');
    }).catch(function (err) {
      $('searchErr').textContent = err.message;
    }).then(function () { busy($('searchBtn'), false); });
  });

  function renderList(rows) {
    $('pickErr').textContent = '';
    $('pickHint').textContent = rows.length > 1
      ? '找到 ' + rows.length + ' 筆同名資料，請依學校與 Email 選擇您本人。'
      : '找到以下報名資料，確認是本人後按下方按鈕。';
    var ul = $('list'); ul.textContent = '';
    rows.forEach(function (r) {
      var li = document.createElement('li'); li.className = 'item';
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = r.name;
      var meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = [r.school, r.program, r.email].filter(Boolean).join('｜');
      li.appendChild(nm); li.appendChild(meta);
      if (r.checkin) {
        var d = document.createElement('p'); d.className = 'done';
        d.textContent = '✓ 報到 ' + fmt(r.checkin) + (r.checkout ? '｜簽退 ' + fmt(r.checkout) : '');
        li.appendChild(d);
      }
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn ' + (r.checkin ? 'btn-navy' : 'btn-primary');
      b.innerHTML = '<span class="spin" aria-hidden="true"></span>';
      b.appendChild(document.createTextNode(!r.checkin ? '確認報到' : r.checkout ? '查看報到／簽退紀錄' : '簽退'));
      b.addEventListener('click', function () {
        if (!r.checkin) return doCheckin(r, b);
        if (r.checkout) return showDone(save({ row: r.row, name: r.name, time: r.checkin, checkout: r.checkout, already: true }));
        doCheckout({ row: r.row, name: r.name, time: r.checkin }, b, $('pickErr'));
      });
      li.appendChild(b);
      ul.appendChild(li);
    });
  }

  /* ---------- 報到 ---------- */
  function doCheckin(r, btn) {
    $('pickErr').textContent = '';
    busy(btn, true);
    post({ action: 'checkin', row: r.row, name: r.name }).then(function (res) {
      showDone(save({ row: r.row, name: res.name, time: res.time, checkout: res.checkout || '', already: res.already }));
    }).catch(function (err) {
      $('pickErr').textContent = err.message;
    }).then(function () { busy(btn, false); });
  }

  /* ---------- 簽退 ---------- */
  function doCheckout(info, btn, errEl) {
    if (!window.confirm(info.name + '，確定要簽退嗎？')) return;
    errEl.textContent = '';
    busy(btn, true);
    post({ action: 'checkout', row: info.row, name: info.name }).then(function (res) {
      showDone(save({ row: info.row, name: res.name, time: res.time, checkout: res.checkout, already: res.already, out: true }));
    }).catch(function (err) {
      errEl.textContent = err.message;
    }).then(function () { busy(btn, false); });
  }

  var current = null;
  function save(info) { current = info; set(localStorage, DONE_STORE, JSON.stringify(info)); return info; }

  function showDone(info) {
    current = info;
    var out = !!info.checkout;
    $('okName').textContent = info.name;
    $('okStatus').textContent = out ? (info.out && !info.already ? '簽退成功，感謝您的參與！' : '您已完成簽退')
                                    : (info.already ? '您已完成報到' : '報到成功');
    $('okIn').textContent = fmt(info.time);
    $('okOut').textContent = out ? fmt(info.checkout) : '—';
    $('outBtn').hidden = out || !info.row;
    $('outErr').textContent = '';
    $('okNote').hidden = out;
    $('home').hidden = !out;
    $('done').classList.toggle('again', !out && !!info.already);
    $('done').classList.toggle('out', out);
    show('done');
  }

  $('outBtn').addEventListener('click', function () { if (current) doCheckout(current, $('outBtn'), $('outErr')); });

  $('home').addEventListener('click', function () {
    set(localStorage, DONE_STORE, null); current = null;
    $('q').value = ''; $('searchErr').textContent = '';
    show('search'); $('q').focus();
  });
  $('back').addEventListener('click', function () { show('search'); $('q').select(); });

  /* ---------- 開始：同一支手機已報到過就直接顯示結果 ---------- */
  var saved = null;
  try { saved = JSON.parse(get(localStorage, DONE_STORE) || 'null'); } catch (e) {}
  if (saved && saved.name) showDone(saved); else show('search');
})();
</script>
</body>
</html>
