<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簽到 QR Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* A4 直式簽到 QR Code 公告（210 × 297 mm），列印請選「實際大小」、無邊界 */
  @page { size: 210mm 297mm; margin: 0; }
  :root { --navy:#213C8F; --orange:#FFA319; --red:#F2541B; --yellow:#FFC83D; --ink:#161616; --soft:#F6F8FC; --green:#1FA463; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9ecf3; }
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact;
    display: flex; justify-content: center; padding: 16px; }
  @media print { html, body { background: none; } body { padding: 0; display: block; } .sheet { box-shadow: none !important; } }

  .sheet { position: relative; overflow: hidden; width: 210mm; height: 297mm; background: #fff; color: var(--ink);
    box-shadow: 0 18px 40px -18px rgba(23,43,106,.45); }
  .bg { position: absolute; inset: 0; background: url("../assets/img/building-sky-960.webp") center 30% / cover no-repeat; opacity: .08;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.4), #000 35%, rgba(0,0,0,.1)); mask-image: linear-gradient(180deg, rgba(0,0,0,.4), #000 35%, rgba(0,0,0,.1)); }

  .deco { position: absolute; pointer-events: none; }
  .deco .b-o { fill: var(--orange); }
  .deco .b-r { fill: var(--red); }
  .deco .dots circle { fill: #fff; }
  .deco .arc, .deco .lines { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; }
  .deco .arc-y { fill: none; stroke: var(--orange); stroke-width: 12; stroke-linecap: round; }
  .d-tl { width: 62mm; top: -18mm; left: -16mm; }
  .d-tr { width: 76mm; top: -22mm; right: -12mm; }
  .d-bl { width: 66mm; bottom: -6mm; left: -8mm; }
  .d-br { width: 66mm; bottom: -8mm; right: -6mm; }

  .inner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18mm 16mm 0; }
  .kicker { font-family: "Poppins", sans-serif; font-weight: 800; letter-spacing: .2em; font-size: 3.4mm; color: var(--navy);
    background: var(--soft); padding: .9mm 4mm; border-radius: 999px; border: .45mm solid var(--navy); }
  .event { margin-top: 3mm; font-weight: 900; font-size: 7.6mm; letter-spacing: .03em; white-space: nowrap; }
  .event b { font-family: "Poppins", sans-serif; color: #fff; background: var(--navy); padding: 0 .22em; border-radius: .2em; display: inline-block; transform: rotate(-4deg); margin: 0 .12em; }

  .title { position: relative; margin-top: 6mm; font-weight: 900; font-size: 21mm; line-height: 1.15; letter-spacing: .06em; color: var(--navy); }
  .title span { padding: 0 .06em; background: linear-gradient(transparent 60%, var(--yellow) 60%, var(--yellow) 92%, transparent 92%); }
  .title .tag { position: absolute; right: -24mm; top: -3mm; font-family: "Poppins", sans-serif; font-size: 4.2mm; letter-spacing: .06em; line-height: 1;
    color: var(--ink); background: #fff; border: .6mm solid var(--ink); border-radius: 999px; padding: 1.5mm 3.4mm; box-shadow: 1mm 1mm 0 var(--ink); transform: rotate(8deg); }
  .lead { margin-top: 5mm; font-size: 6.2mm; font-weight: 700; color: #3a4052; }

  /* 步驟 */
  .steps { margin-top: 7mm; width: 100%; display: flex; flex-direction: column; gap: 7mm; }
  .step { position: relative; display: flex; align-items: center; gap: 6mm; text-align: left;
    background: #fff; border: .9mm solid var(--ink); border-radius: 7mm; box-shadow: 1.8mm 1.8mm 0 var(--ink); padding: 4.2mm 6mm 4.2mm 5mm; }
  .num { flex: none; width: 17mm; height: 17mm; border-radius: 50%; display: grid; place-items: center;
    font-family: "Poppins", sans-serif; font-weight: 900; font-size: 9.5mm; color: #fff; border: .8mm solid var(--ink); }
  .s1 .num { background: var(--navy); }
  .s2 .num { background: var(--orange); color: var(--ink); }
  .s3 .num { background: var(--red); }
  .txt { flex: 1; }
  .txt h3 { font-size: 8.6mm; font-weight: 900; line-height: 1.3; letter-spacing: .02em; }
  .txt h3 em { font-style: normal; color: var(--red); }
  .txt p { margin-top: 1.4mm; font-size: 4.6mm; font-weight: 700; color: #4a5266; line-height: 1.45; }
  .ill { flex: none; width: 28mm; height: 28mm; }
  .arrow { position: absolute; left: calc(50% - 3mm); bottom: -6.6mm; width: 6mm; height: 5.2mm; z-index: 2; }

  .enter { margin-top: 6.5mm; display: inline-flex; align-items: center; gap: 3mm; font-weight: 900; font-size: 9mm; letter-spacing: .06em;
    color: #fff; background: var(--red); border: .9mm solid var(--ink); border-radius: 999px; padding: 2.4mm 9mm 2.4mm 4mm; box-shadow: 1.8mm 1.8mm 0 var(--ink); transform: rotate(-2deg); }
  .enter svg { width: 11mm; height: 11mm; background: #fff; border-radius: 50%; border: .6mm solid var(--ink); padding: 1.4mm; }
  .note { margin-top: 4.5mm; font-size: 4.4mm; font-weight: 700; color: #4a5266; }

  .qr-card { position: relative; margin-top: 9mm; background: #fff; border: 1mm solid var(--ink); border-radius: 8mm; box-shadow: 2.4mm 2.4mm 0 var(--ink); padding: 9mm; }
  .qr { display: block; width: 112mm; height: 112mm; }
  .corner { position: absolute; width: 14mm; height: 14mm; border: 2.2mm solid var(--orange); }
  .c1 { top: -4mm; left: -4mm; border-right: 0; border-bottom: 0; border-radius: 5mm 0 0 0; }
  .c2 { top: -4mm; right: -4mm; border-left: 0; border-bottom: 0; border-radius: 0 5mm 0 0; border-color: var(--red); }
  .c3 { bottom: -4mm; left: -4mm; border-right: 0; border-top: 0; border-radius: 0 0 0 5mm; border-color: var(--red); }
  .c4 { bottom: -4mm; right: -4mm; border-left: 0; border-top: 0; border-radius: 0 0 5mm 0; }
  .scan { margin-top: 11mm; display: inline-flex; align-items: center; gap: 3mm; font-weight: 900; font-size: 8mm; letter-spacing: .04em;
    color: #fff; background: var(--navy); border: .9mm solid var(--ink); border-radius: 999px; padding: 2.4mm 8mm 2.4mm 4mm; box-shadow: 1.8mm 1.8mm 0 var(--ink); transform: rotate(-2deg); }
  .scan svg { width: 10mm; height: 10mm; }
  .tape { position: absolute; z-index: 3; left: -8mm; right: -8mm; bottom: 12mm; background: var(--navy); border-block: .8mm solid var(--ink); box-shadow: 0 1.3mm 0 var(--ink);
    transform: rotate(-3deg); color: #fff; display: flex; align-items: center; justify-content: center; gap: 4.5mm;
    padding: 2mm 0; font-weight: 900; font-size: 6mm; letter-spacing: .06em; white-space: nowrap; overflow: hidden; }
  .tape b { font-family: "Poppins", sans-serif; color: var(--yellow); }
  .tape svg { width: 5mm; height: 5mm; flex: none; }
  .tape .s { color: var(--yellow); }
  .tape .fl { color: var(--orange); }
</style>
</head>
