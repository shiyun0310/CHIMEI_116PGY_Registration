<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>報到台指示牌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* A4 橫式指示牌（297 × 210 mm）：報到台在左側。PDF 為向量，可等比放大印 A3 */
  @page { size: 297mm 210mm; margin: 0; }
  :root { --navy:#213C8F; --orange:#FFA319; --red:#F2541B; --yellow:#FFC83D; --ink:#161616; --soft:#F6F8FC; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9ecf3; }
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; display: flex; justify-content: center; padding: 16px; }
  @media print { html, body { background: none; } body { padding: 0; display: block; } .sheet { box-shadow: none !important; } }
  .sheet { position: relative; overflow: hidden; width: 297mm; height: 210mm; background: #fff; color: var(--ink); box-shadow: 0 18px 40px -18px rgba(23,43,106,.45); }
  .bg { position: absolute; inset: 0; background: url("../assets/img/building-sky-1920.webp") center 40% / cover no-repeat; opacity: .07; }
  .deco { position: absolute; pointer-events: none; }
  .deco .b-o { fill: var(--orange); }
  .deco .b-r { fill: var(--red); }
  .deco .dots circle { fill: #fff; }
  .deco .arc, .deco .lines { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; }
  .deco .arc-y { fill: none; stroke: var(--orange); stroke-width: 12; stroke-linecap: round; }
  .d-tl { width: 54mm; top: -20mm; left: -18mm; }
  .d-tr { width: 70mm; top: -24mm; right: -14mm; }
  .d-bl { width: 58mm; bottom: -10mm; left: -12mm; }
  .d-br { width: 58mm; bottom: -12mm; right: -8mm; }

  .inner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; padding: 13mm 18mm 0; }
  .top { display: flex; align-items: center; justify-content: center; gap: 4mm; }
  .kicker { font-family: "Poppins", sans-serif; font-weight: 800; letter-spacing: .2em; font-size: 3.2mm; color: var(--navy); background: var(--soft); padding: .9mm 4mm; border-radius: 999px; border: .45mm solid var(--navy); }
  .event { font-weight: 900; font-size: 6.4mm; letter-spacing: .03em; white-space: nowrap; }
  .event b { font-family: "Poppins", sans-serif; color: #fff; background: var(--navy); padding: 0 .22em; border-radius: .2em; display: inline-block; transform: rotate(-4deg); margin: 0 .12em; }

  .row { flex: 1; display: flex; align-items: center; gap: 10mm; margin-top: -6mm; }
  .arrow { flex: none; width: 112mm; height: 92mm; filter: drop-shadow(2.4mm 2.4mm 0 var(--ink)); }
  .txt { flex: 1; display: flex; flex-direction: column; align-items: flex-start; }
  .tag { font-family: "Poppins", sans-serif; font-weight: 900; font-size: 6.4mm; letter-spacing: .1em; color: var(--ink); background: var(--yellow); border: .7mm solid var(--ink); border-radius: 999px; padding: 1mm 5mm; box-shadow: 1.2mm 1.2mm 0 var(--ink); transform: rotate(-4deg); }
  .big { margin-top: 3mm; font-weight: 900; font-size: 38mm; line-height: 1.1; letter-spacing: .06em; color: var(--navy); white-space: nowrap; }
  .big span { padding: 0 .04em; background: linear-gradient(transparent 62%, var(--yellow) 62%, var(--yellow) 92%, transparent 92%); }
  .side { margin-top: 2mm; font-weight: 900; font-size: 15mm; letter-spacing: .08em; white-space: nowrap; }
  .side b { color: var(--red); }
  .note { margin-top: 3mm; font-size: 5mm; font-weight: 700; color: #4a5266; }

  .tape { position: absolute; z-index: 3; left: -8mm; right: -8mm; bottom: 7mm; background: var(--navy); border-block: .8mm solid var(--ink); box-shadow: 0 1.3mm 0 var(--ink);
    transform: rotate(-1.5deg); color: #fff; display: flex; align-items: center; justify-content: center; gap: 4mm; padding: 1.6mm 0; font-weight: 900; font-size: 5mm; letter-spacing: .06em; white-space: nowrap; overflow: hidden; }
  .tape b { font-family: "Poppins", sans-serif; color: var(--yellow); }
  .tape svg { width: 4.4mm; height: 4.4mm; flex: none; }
  .tape .s { color: var(--yellow); }
  .tape .fl { color: var(--orange); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 4l7 19 21 1-16 13 6 21-18-12-18 12 6-21L4 24l21-1z" fill="currentColor"/></symbol>
  <symbol id="i-flower" viewBox="0 0 64 64"><path d="M32 30C20 4 44 4 32 30 58 18 58 46 32 34 44 60 20 60 32 34 6 46 6 18 32 30z" fill="currentColor"/></symbol>
</defs></svg>
<div class="sheet">
  <div class="bg"></div>
  <svg class="deco d-tl" viewBox="0 0 300 300" aria-hidden="true"><path class="b-o" d="M40 60c40-50 120-30 130 20s-40 70-30 120-90 70-120 20S0 110 40 60z"/><g class="dots"><circle cx="70" cy="100" r="7"/><circle cx="100" cy="80" r="5"/><circle cx="60" cy="150" r="6"/><circle cx="110" cy="130" r="5"/><circle cx="85" cy="190" r="7"/></g><path class="arc" d="M120 160a20 20 0 0 1 28 0M50 210a18 18 0 0 1 26 0"/></svg>
  <svg class="deco d-tr" viewBox="0 0 360 300" aria-hidden="true"><path class="b-r" d="M120 0h240v200c-30 40-80 10-100 50s-90 40-90-10 40-60 10-90-90-20-80-70S90 20 120 0z"/><path class="lines" d="M220 40c10 20 30 20 40 40M280 70c8 16 26 16 34 30M180 120c12 10 26 12 36 4"/></svg>
  <svg class="deco d-bl" viewBox="0 0 320 300" aria-hidden="true"><path class="b-r" d="M0 120c50-30 100 10 130 60s70 50 60 100-160 30-190 20z"/><path class="arc-y" d="M150 90a50 50 0 0 1 70 70M150 120a26 26 0 0 1 40 36"/></svg>
  <svg class="deco d-br" viewBox="0 0 320 300" aria-hidden="true"><path class="b-o" d="M320 80c-60 0-90 40-110 90s-80 40-80 90 50 50 190 40z"/><g class="dots"><circle cx="250" cy="170" r="7"/><circle cx="280" cy="140" r="5"/><circle cx="220" cy="230" r="6"/><circle cx="270" cy="250" r="7"/></g></svg>
  <div class="inner">
    <div class="top"><p class="kicker">CHI MEI MEDICAL CENTER</p><p class="event">奇美醫院西醫<b>PGY</b>醫師招募說明會</p></div>
    <div class="row">
      <svg class="arrow" viewBox="0 0 120 100" aria-label="向左箭頭" role="img">
        <path d="M6 50 52 6v24h56a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H52v24z" fill="#F2541B" stroke="#161616" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M60 40h44M60 50h36M60 60h28" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".55"/>
        <circle cx="30" cy="50" r="3.5" fill="#FFC83D"/>
      </svg>
      <div class="txt">
        <span class="tag">CHECK-IN</span>
        <p class="big"><span>報到台</span></p>
        <p class="side">在<b>左側</b>，請往左走</p>
        <p class="note">請先至報到台完成簽到再入場</p>
      </div>
    </div>
  </div>
  <div class="tape"><span>選擇奇美</span><svg class="s"><use href="#i-star"/></svg><span>創造 <b>360°</b> 醫學人生</span><svg class="fl"><use href="#i-flower"/></svg><span>選擇奇美</span><svg class="s"><use href="#i-star"/></svg><span>創造 <b>360°</b> 醫學人生</span><svg class="fl"><use href="#i-flower"/></svg><span>選擇奇美</span><svg class="s"><use href="#i-star"/></svg><span>創造 <b>360°</b> 醫學人生</span><svg class="fl"><use href="#i-flower"/></svg><span>選擇奇美</span><svg class="s"><use href="#i-star"/></svg><span>創造 <b>360°</b> 醫學人生</span><svg class="fl"><use href="#i-flower"/></svg><span>選擇奇美</span></div>
</div>
</body>
</html>
