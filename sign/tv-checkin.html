<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簽到說明直式電視</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* 直立式電視 45 × 80 cm（9:16）。版面以 1080 × 1920 px 設計，輸出 2160 × 3840 PNG 與 450 × 800 mm PDF */
  @page { size: 450mm 800mm; margin: 0; }
  :root { --navy:#213C8F; --orange:#FFA319; --red:#F2541B; --yellow:#FFC83D; --ink:#161616; --soft:#F6F8FC; --green:#1E9E5A; --sky:#5B8DEF; --blue:#2F6FE0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9ecf3; }
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; display: flex; justify-content: center; padding: 16px; }
  @media print { html, body { background: none; } body { padding: 0; display: block; } .sheet { box-shadow: none !important; zoom: 1.5747; } }

  .sheet { position: relative; overflow: hidden; width: 1080px; height: 1920px; background: #fff; color: var(--ink); box-shadow: 0 18px 40px -18px rgba(23,43,106,.45); }
  .bg { position: absolute; inset: 0; background: url("../assets/img/building-sky-1920.webp") center 30% / cover no-repeat; opacity: .09;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.4), #000 35%, rgba(0,0,0,.1)); mask-image: linear-gradient(180deg, rgba(0,0,0,.4), #000 35%, rgba(0,0,0,.1)); }
  .deco { position: absolute; pointer-events: none; }
  .deco .b-o { fill: var(--orange); }
  .deco .b-r { fill: var(--red); }
  .deco .dots circle { fill: #fff; }
  .deco .arc, .deco .lines { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; }
  .deco .arc-y { fill: none; stroke: var(--orange); stroke-width: 12; stroke-linecap: round; }
  .d-tl { width: 300px; top: -80px; left: -70px; }
  .d-tr { width: 360px; top: -100px; right: -50px; }
  .d-bl { width: 320px; bottom: -30px; left: -40px; }
  .d-br { width: 320px; bottom: -40px; right: -30px; }

  .inner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 52px 64px 0; }
  .kicker { font-family: "Poppins", sans-serif; font-weight: 800; letter-spacing: .2em; font-size: 20px; color: var(--navy); background: var(--soft); padding: 6px 24px; border-radius: 999px; border: 3px solid var(--navy); }
  .event { margin-top: 16px; font-weight: 900; font-size: 46px; letter-spacing: .03em; white-space: nowrap; }
  .event b { font-family: "Poppins", sans-serif; color: #fff; background: var(--navy); padding: 0 .22em; border-radius: .2em; display: inline-block; transform: rotate(-4deg); margin: 0 .12em; }
  .title { position: relative; margin-top: 22px; font-weight: 900; font-size: 90px; line-height: 1.12; letter-spacing: .08em; color: var(--navy); }
  .title span { padding: 0 .06em; background: linear-gradient(transparent 60%, var(--yellow) 60%, var(--yellow) 92%, transparent 92%); }
  .title .tag { position: absolute; right: -185px; top: 54px; font-family: "Poppins", sans-serif; font-size: 26px; letter-spacing: .06em; line-height: 1;
    color: var(--ink); background: #fff; border: 4px solid var(--ink); border-radius: 999px; padding: 10px 22px; box-shadow: 6px 6px 0 var(--ink); transform: rotate(8deg); }

  /* QR 主角 */
  .qr-wrap { margin-top: 28px; width: 100%; background: var(--navy); border: 6px solid var(--ink); border-radius: 44px; box-shadow: 12px 12px 0 var(--ink); padding: 24px 40px 24px; color: #fff; }
  .qr-head { display: flex; align-items: center; justify-content: center; gap: 20px; }
  .qr-tag { font-family: "Poppins", sans-serif; font-weight: 800; font-size: 26px; letter-spacing: .12em; color: var(--ink); background: var(--yellow); border-radius: 999px; padding: 4px 22px; }
  .qr-head h2 { font-size: 60px; font-weight: 900; letter-spacing: .02em; }
  .qr-head h2 b { font-family: "Poppins", sans-serif; color: var(--yellow); }
  .qr-box { position: relative; margin: 24px auto 0; width: 500px; background: #fff; border: 5px solid var(--ink); border-radius: 32px; padding: 28px; }
  .qr { display: block; width: 100%; height: auto; }
  .corner { position: absolute; width: 66px; height: 66px; border: 12px solid var(--orange); }
  .c1 { top: -24px; left: -24px; border-right: 0; border-bottom: 0; border-radius: 30px 0 0 0; }
  .c2 { top: -24px; right: -24px; border-left: 0; border-bottom: 0; border-radius: 0 30px 0 0; border-color: var(--red); }
  .c3 { bottom: -24px; left: -24px; border-right: 0; border-top: 0; border-radius: 0 0 0 30px; border-color: var(--red); }
  .c4 { bottom: -24px; right: -24px; border-left: 0; border-top: 0; border-radius: 0 0 30px 0; }
  .qr-sub { margin-top: 24px; font-size: 32px; font-weight: 700; opacity: .95; }

  /* 步驟（直式） */
  .steps { margin-top: 30px; width: 100%; display: flex; flex-direction: column; gap: 22px; }
  .step { position: relative; display: flex; align-items: center; gap: 24px; text-align: left; background: #fff; border: 5px solid var(--ink); border-radius: 30px; box-shadow: 8px 8px 0 var(--ink); padding: 14px 28px 14px 22px; }
  .num { flex: none; width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; font-family: "Poppins", sans-serif; font-weight: 900; font-size: 40px; color: #fff; border: 4px solid var(--ink); }
  .s1 .num { background: var(--navy); } .s2 .num { background: var(--orange); color: var(--ink); } .s3 .num { background: var(--red); } .s4 .num { background: var(--green); }
  .txt { flex: 1; min-width: 0; }
  .txt h3 { font-size: 38px; font-weight: 900; line-height: 1.25; letter-spacing: .02em; }
  .txt h3 em { font-style: normal; color: var(--red); }
  .txt p { margin-top: 2px; font-size: 24px; font-weight: 700; color: #4a5266; }
  .ill { flex: none; width: 76px; height: 76px; }
  .arrow { position: absolute; left: calc(50% - 14px); bottom: -21px; width: 26px; height: 20px; z-index: 2; }

  .gift { margin-top: 26px; display: inline-flex; align-items: center; gap: 18px; font-weight: 900; font-size: 48px; letter-spacing: .04em;
    color: #fff; background: var(--red); border: 6px solid var(--ink); border-radius: 999px; padding: 14px 56px 14px 20px; box-shadow: 10px 10px 0 var(--ink); transform: rotate(-2deg); }
  .gift b { color: var(--yellow); }
  .gift svg { stroke-width: 0; }
  .gift svg { width: 76px; height: 76px; background: #fff; border-radius: 50%; border: 4px solid var(--ink); padding: 9px; }
  .note { margin-top: 18px; font-size: 26px; font-weight: 700; color: #4a5266; }

  .tape { position: absolute; z-index: 3; left: -40px; right: -40px; bottom: 34px; background: var(--navy); border-block: 5px solid var(--ink); box-shadow: 0 8px 0 var(--ink);
    transform: rotate(-3deg); color: #fff; display: flex; align-items: center; justify-content: center; gap: 26px; padding: 12px 0; font-weight: 900; font-size: 36px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; }
  .tape b { font-family: "Poppins", sans-serif; color: var(--yellow); text-shadow: 0 2px 0 var(--ink); }
  .tape svg { width: 30px; height: 30px; flex: none; }
  .tape .s { color: var(--yellow); }
  .tape .fl { color: var(--orange); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 4l7 19 21 1-16 13 6 21-18-12-18 12 6-21L4 24l21-1z" fill="currentColor"/></symbol>
  <symbol id="i-flower" viewBox="0 0 64 64"><path d="M32 30C20 4 44 4 32 30 58 18 58 46 32 34 44 60 20 60 32 34 6 46 6 18 32 30z" fill="currentColor"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 20"><path d="M2 3h20L12 18z" fill="#5B8DEF" stroke="#161616" stroke-width="2.5" stroke-linejoin="round"/></symbol>
</defs></svg>

<div class="sheet">
  <div class="bg"></div>
  <svg class="deco d-tl" viewBox="0 0 300 300" aria-hidden="true"><path class="b-o" d="M40 60c40-50 120-30 130 20s-40 70-30 120-90 70-120 20S0 110 40 60z"/><g class="dots"><circle cx="70" cy="100" r="7"/><circle cx="100" cy="80" r="5"/><circle cx="60" cy="150" r="6"/><circle cx="110" cy="130" r="5"/><circle cx="85" cy="190" r="7"/></g><path class="arc" d="M120 160a20 20 0 0 1 28 0M50 210a18 18 0 0 1 26 0"/></svg>
  <svg class="deco d-tr" viewBox="0 0 360 300" aria-hidden="true"><path class="b-r" d="M120 0h240v200c-30 40-80 10-100 50s-90 40-90-10 40-60 10-90-90-20-80-70S90 20 120 0z"/><path class="lines" d="M220 40c10 20 30 20 40 40M280 70c8 16 26 16 34 30M180 120c12 10 26 12 36 4"/></svg>
  <svg class="deco d-bl" viewBox="0 0 320 300" aria-hidden="true"><path class="b-r" d="M0 120c50-30 100 10 130 60s70 50 60 100-160 30-190 20z"/><path class="arc-y" d="M150 90a50 50 0 0 1 70 70M150 120a26 26 0 0 1 40 36"/></svg>
  <svg class="deco d-br" viewBox="0 0 320 300" aria-hidden="true"><path class="b-o" d="M320 80c-60 0-90 40-110 90s-80 40-80 90 50 50 190 40z"/><g class="dots"><circle cx="250" cy="170" r="7"/><circle cx="280" cy="140" r="5"/><circle cx="220" cy="230" r="6"/><circle cx="270" cy="250" r="7"/></g></svg>

  <div class="inner">
    <p class="kicker">CHI MEI MEDICAL CENTER</p>
    <p class="event">奇美西醫<b>PGY</b>醫師招募說明會</p>
    <h1 class="title"><span>簽到入場說明</span><i class="tag">CHECK-IN</i></h1>

    <div class="qr-wrap">
      <div class="qr-head"><span class="qr-tag">STEP 0</span><h2>手機掃描 <b>QR Code</b></h2></div>
      <div class="qr-box"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span><svg class="qr" aria-label="簽到頁 QR Code" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37 37" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h37v37H0z"/><path stroke="#161616" d="M0 0.5h7m1 0h3m1 0h2m1 0h1m3 0h2m2 0h6m1 0h7M0 1.5h1m5 0h1m2 0h1m3 0h1m1 0h1m3 0h1m1 0h1m2 0h1m1 0h1m3 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m3 0h1m1 0h7m2 0h2m1 0h1m1 0h3m1 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m1 0h2m1 0h1m1 0h1m2 0h3m3 0h1m2 0h1m4 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m1 0h2m2 0h2m3 0h3m1 0h1m1 0h1m1 0h1m1 0h1m2 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m1 0h1m4 0h2m2 0h1m1 0h1m1 0h2m2 0h1m4 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M8 7.5h1m5 0h2m4 0h2m1 0h2m1 0h3M0 8.5h1m3 0h1m1 0h3m2 0h1m3 0h2m3 0h1m3 0h1m4 0h5m2 0h1M0 9.5h1m2 0h1m1 0h1m1 0h1m3 0h3m3 0h3m1 0h1m1 0h1m1 0h5m2 0h2m1 0h1M0 10.5h3m3 0h5m2 0h1m1 0h1m1 0h1m1 0h1m3 0h1m3 0h1m1 0h1m1 0h1m2 0h1M1 11.5h1m1 0h1m1 0h1m5 0h1m3 0h8m1 0h1m1 0h1m1 0h1m1 0h1m3 0h2M0 12.5h2m2 0h3m1 0h2m1 0h2m1 0h1m1 0h1m3 0h4m2 0h1m1 0h3m3 0h3M2 13.5h3m5 0h2m1 0h1m2 0h1m2 0h1m1 0h1m1 0h1m1 0h1m1 0h1m4 0h2M0 14.5h1m4 0h2m2 0h3m2 0h2m1 0h1m2 0h1m2 0h1m1 0h1m1 0h2m2 0h4M0 15.5h1m1 0h1m4 0h1m2 0h2m2 0h1m2 0h2m3 0h2m2 0h1m2 0h1m1 0h2m1 0h3M0 16.5h1m3 0h3m1 0h1m1 0h1m1 0h1m1 0h1m3 0h1m3 0h3m2 0h1m1 0h3m1 0h2m1 0h1M1 17.5h1m1 0h2m2 0h8m1 0h2m1 0h3m1 0h1m1 0h4m3 0h2m1 0h1M1 18.5h4m1 0h1m3 0h4m2 0h1m1 0h1m1 0h4m3 0h1m1 0h2m1 0h1M0 19.5h1m1 0h1m1 0h1m3 0h3m2 0h2m2 0h2m2 0h1m2 0h1m4 0h1m4 0h2M1 20.5h4m1 0h2m3 0h1m1 0h3m1 0h8m1 0h2m1 0h3m2 0h1M2 21.5h1m1 0h1m4 0h1m2 0h1m1 0h1m1 0h2m1 0h1m3 0h1m2 0h3m2 0h2m2 0h2M0 22.5h2m1 0h2m1 0h2m1 0h2m2 0h4m1 0h1m2 0h3m1 0h1m1 0h1m1 0h6M0 23.5h5m2 0h1m1 0h8m4 0h1m1 0h2m1 0h2m3 0h2m1 0h1m1 0h1M1 24.5h3m1 0h4m1 0h1m1 0h1m3 0h1m3 0h1m3 0h1m4 0h2m2 0h3M0 25.5h2m1 0h2m2 0h1m2 0h4m4 0h2m1 0h3m2 0h2m4 0h1m1 0h1M2 26.5h1m1 0h3m1 0h1m1 0h1m2 0h1m1 0h1m1 0h1m1 0h1m3 0h1m1 0h6m3 0h1M2 27.5h1m2 0h1m2 0h2m1 0h1m2 0h8m2 0h1m6 0h1m2 0h2M0 28.5h2m1 0h1m1 0h4m2 0h2m1 0h1m1 0h3m1 0h2m1 0h1m3 0h10M8 29.5h2m1 0h2m3 0h1m2 0h1m1 0h1m1 0h1m2 0h3m3 0h1m2 0h2M0 30.5h7m1 0h2m1 0h1m1 0h1m1 0h3m2 0h1m2 0h2m3 0h1m1 0h1m1 0h1M0 31.5h1m5 0h1m2 0h2m1 0h1m4 0h3m2 0h2m2 0h1m1 0h1m3 0h3M0 32.5h1m1 0h3m1 0h1m1 0h2m3 0h2m3 0h2m2 0h3m3 0h7M0 33.5h1m1 0h3m1 0h1m2 0h1m1 0h3m2 0h1m2 0h3m1 0h1m1 0h3m1 0h3m4 0h1M0 34.5h1m1 0h3m1 0h1m3 0h1m1 0h1m1 0h1m1 0h2m2 0h1m2 0h1m1 0h3m2 0h1M0 35.5h1m5 0h1m2 0h6m2 0h2m2 0h1m2 0h1m1 0h2m2 0h1m1 0h1m1 0h2M0 36.5h7m1 0h1m1 0h1m1 0h1m1 0h7m1 0h3m2 0h1m1 0h1m1 0h1m1 0h4"/></svg></div>
      <p class="qr-sub">開啟簽到頁面，依下列步驟完成簽到</p>
    </div>

    <div class="steps">
      <div class="step s1">
        <span class="num">1</span>
        <div class="txt"><h3>輸入<em>姓名</em>查詢</h3><p>確認個人報名資料是否正確，如有錯誤請告知工作人員</p></div>
        <svg class="ill" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="12" y="4" width="32" height="56" rx="6" fill="#fff" stroke="#161616" stroke-width="3.5"/>
          <rect x="17" y="15" width="22" height="7" rx="2" fill="#F6F8FC" stroke="#213C8F" stroke-width="2"/>
          <path d="M20 18.5h9" stroke="#213C8F" stroke-width="2" stroke-linecap="round"/>
          <path d="M17 28h22M17 34h16M17 40h19" stroke="#c5cbd8" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M24 9h8" stroke="#161616" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="46" cy="40" r="9" fill="#FFC83D" stroke="#161616" stroke-width="3.5"/>
          <path d="M52.5 46.5 60 54" stroke="#161616" stroke-width="5" stroke-linecap="round"/>
        </svg><svg class="arrow" viewBox="0 0 24 20" aria-hidden="true"><path d="M2 3h20L12 18z" fill="#FFA319" stroke="#161616" stroke-width="2.5" stroke-linejoin="round"/></svg>
      </div>
      <div class="step s2">
        <span class="num">2</span>
        <div class="txt"><h3>按下<em>「確認報到」</em></h3><p>資料確認無誤後，完成簽到</p></div>
        <svg class="ill" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="4" y="12" width="48" height="18" rx="9" fill="#F2541B" stroke="#161616" stroke-width="3.5"/>
          <path d="M15 21h26" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M34 60V36a4 4 0 0 1 8 0v10l3-1.4a4 4 0 0 1 5 1.6l1 .8a4 4 0 0 1 5 2.4v1a4 4 0 0 1 4 4V60" fill="#FFD9B8" stroke="#161616" stroke-width="3.2" stroke-linejoin="round"/>
          <path d="M30 26l-3-4M38 25v-5M46 26l3-4" stroke="#FFA319" stroke-width="3" stroke-linecap="round"/>
        </svg><svg class="arrow" viewBox="0 0 24 20" aria-hidden="true"><path d="M2 3h20L12 18z" fill="#FFA319" stroke="#161616" stroke-width="2.5" stroke-linejoin="round"/></svg>
      </div>
      <div class="step s3">
        <span class="num">3</span>
        <div class="txt"><h3>出示<em>報到成功</em>畫面</h3><p>請將手機畫面給工作人員確認</p></div>
        <svg class="ill" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="14" y="4" width="36" height="56" rx="6" fill="#fff" stroke="#161616" stroke-width="3.5"/>
          <path d="M27 9h10" stroke="#161616" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="32" cy="29" r="10" fill="#1FA463"/>
          <path d="M27 29.5l3.4 3.4L37.5 25.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 45h20M25 51h14" stroke="#c5cbd8" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <p class="gift"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#1FA463" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>確認後即可入場</span></p>
    <p class="note">找不到報名資料或未事先報名，請洽報到工作人員</p>
  </div>

    <div class="tape"><span>選擇奇美</span><svg class="s"><use href="#i-star"/></svg><span>創造 <b>360°</b> 醫學人生</span><svg class="fl"><use href="#i-flower"/></svg><span>選擇奇美</span><svg class="s"><use href="#i-star"/></svg><span>創造 <b>360°</b> 醫學人生</span></div>
</div>
</body>
</html>
