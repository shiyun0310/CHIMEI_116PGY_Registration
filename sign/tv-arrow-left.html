<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>報到台指示直式電視</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* 直立式電視 45 × 80 cm（1080 × 1920 px）：上半沿用說明會海報，下半改為「報到台在左側，請往左走」 */
  @page { size: 450mm 800mm; margin: 0; }
  :root { --navy:#213C8F; --orange:#FFA319; --red:#F2541B; --yellow:#FFC83D; --ink:#161616; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9ecf3; }
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; display: flex; justify-content: center; padding: 16px; }
  @media print { html, body { background: none; } body { padding: 0; display: block; } .sheet { box-shadow: none !important; zoom: 1.5747; } }
  .sheet { position: relative; overflow: hidden; width: 1080px; height: 1920px; background: #FDFDFD; color: var(--ink); box-shadow: 0 18px 40px -18px rgba(23,43,106,.45); }
  .top { position: absolute; left: 0; top: 0; width: 1080px; height: auto; display: block; }
  .fade { position: absolute; left: 0; right: 0; top: 880px; height: 90px; background: linear-gradient(rgba(253,253,253,0), #FDFDFD); }
  .foot { position: absolute; left: 0; bottom: 0; width: 1080px; height: auto; display: block; }

  .bgimg { position: absolute; left: 0; right: 0; top: 700px; bottom: 0; background: url("../assets/img/building-sky-1920.webp") 30% 70% / cover no-repeat; opacity: .10; filter: grayscale(1);
    -webkit-mask-image: linear-gradient(rgba(0,0,0,0), #000 30%, #000 80%, rgba(0,0,0,0)); mask-image: linear-gradient(rgba(0,0,0,0), #000 30%, #000 80%, rgba(0,0,0,0)); }
  .top { -webkit-mask-image: linear-gradient(#000 99%, rgba(0,0,0,0)); mask-image: linear-gradient(#000 99%, rgba(0,0,0,0)); z-index: 1; }
  .mid { position: absolute; z-index: 2; left: 0; right: 0; top: 985px; bottom: 83px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
  /* 緞帶（同海報「招募說明會」） */
  .ribbon { position: relative; width: 900px; height: 200px; }
  .ribbon svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ribbon p { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 34px; font-weight: 900; font-size: 128px; letter-spacing: .06em; color: var(--ink); white-space: nowrap; line-height: 1; }
  .ribbon p b { color: var(--red); }
  /* 箭頭（同海報「奇美」字：深藍＋白邊＋黃色位移陰影） */
  .arrow { position: relative; margin-top: 26px; width: 960px; height: 330px; }
  .arrow svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .arrow p { position: absolute; left: 300px; right: 50px; top: 0; bottom: 14px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 132px; letter-spacing: .12em; color: #fff; white-space: nowrap; }
  /* 膠囊（同海報地點標籤） */
  .pill { margin-top: 46px; display: inline-flex; align-items: center; gap: 22px; background: var(--red); border: 6px solid #C9400F; border-radius: 999px; padding: 12px 44px 12px 14px; color: #fff; font-weight: 900; font-size: 44px; letter-spacing: .04em; white-space: nowrap; }
  .pill i { width: 84px; height: 84px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .pill i svg { width: 56px; height: 56px; }
  .ic { position: absolute; z-index: 2; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 4l7 19 21 1-16 13 6 21-18-12-18 12 6-21L4 24l21-1z" fill="currentColor"/></symbol>
  <symbol id="i-flower" viewBox="0 0 64 64"><path d="M32 30C20 4 44 4 32 30 58 18 58 46 32 34 44 60 20 60 32 34 6 46 6 18 32 30z" fill="currentColor"/></symbol>
</defs></svg>
<div class="sheet">
  <img class="top" src="img/poster-top.jpg" alt="奇美 116學年度 西醫PGY醫師招募說明會 115年11月29日 13:30-17:00 13:00開放報到 奇美醫院第五醫療大樓5樓國際會議廳">
  <div class="bgimg"></div>
  <svg class="ic" style="left:48px;top:1690px;width:54px;height:54px;color:#FFC83D"><use href="#i-star"/></svg>
  <svg class="ic" style="right:56px;top:1680px;width:58px;height:50px" viewBox="0 0 64 56"><path d="M32 54S4 37 4 19A14 14 0 0 1 32 12a14 14 0 0 1 28 7c0 18-28 35-28 35z" fill="#D7263D"/></svg>
  <div class="mid">
    <div class="ribbon">
      <svg viewBox="0 0 900 200" aria-hidden="true">
        <path d="M30 120 120 104 112 190 70 160 6 176 40 148z" fill="#E0A21F"/>
        <path d="M870 120 780 104 788 190 830 160 894 176 860 148z" fill="#E0A21F"/>
        <path d="M80 90Q450 40 820 90L812 172Q450 120 88 172z" fill="#FFC83D"/>
      </svg>
      <p>報到台在<b>左側</b></p>
    </div>
    <div class="arrow">
      <svg viewBox="0 0 960 330" aria-hidden="true">
        <g transform="translate(18 18)"><path d="M20 156 290 16a10 10 0 0 1 15 9v77h610a24 24 0 0 1 24 24v60a24 24 0 0 1-24 24H305v77a10 10 0 0 1-15 9z" fill="#FFC83D" stroke="#FFC83D" stroke-width="22" stroke-linejoin="round"/></g>
        <path d="M20 156 290 16a10 10 0 0 1 15 9v77h610a24 24 0 0 1 24 24v60a24 24 0 0 1-24 24H305v77a10 10 0 0 1-15 9z" fill="#213C8F" stroke="#fff" stroke-width="22" stroke-linejoin="round" paint-order="stroke"/>
        <path d="M200 120l-36 36 36 36M150 120l-36 36 36 36" fill="none" stroke="#FFC83D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p>請往左走</p>
    </div>
    <p class="pill"><i><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="10" width="40" height="48" rx="6" fill="#fff" stroke="#161616" stroke-width="4"/><rect x="22" y="5" width="20" height="11" rx="4" fill="#F2541B" stroke="#161616" stroke-width="3.5"/><path d="M22 36l7 7 13-15" fill="none" stroke="#1FA463" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></i>請先至報到台完成簽到再入場</p>
  </div>
  <img class="foot" src="img/poster-footer.jpg" alt="聯絡資訊：奇美教學部PGY訓練組">
</div>
</body>
</html>
