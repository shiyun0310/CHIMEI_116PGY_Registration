<title>Coffee Break 橫式</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>  :root { --navy:#213C8F; --orange:#FFA319; --red:#F2541B; --yellow:#FFC83D; --ink:#161616; --soft:#F6F8FC; --sky:#5B8DEF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9ecf3; }
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; display: flex; justify-content: center; padding: 16px; }
  .sheet { position: relative; overflow: hidden; background: #FFF1CC; color: var(--ink); box-shadow: 0 18px 40px -18px rgba(23,43,106,.45); }
  .bg { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,163,25,.35) 3px, transparent 3.5px); background-size: 46px 46px; }
  .bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #FFF8E6 0, rgba(255,248,230,.85) 35%, transparent 70%); }
  .confetti { position: absolute; inset: 0; z-index: 1; }
  .cf { position: absolute; width: calc(26px * var(--s)); height: calc(12px * var(--s)); border-radius: 6px; background: var(--c); border: 3px solid var(--ink); transform: rotate(var(--r)); }
  .cf:nth-child(3n) { width: calc(20px * var(--s)); height: calc(20px * var(--s)); border-radius: 50%; }
  .cf:nth-child(4n) { width: 0; height: 0; border: 0; border-left: calc(13px * var(--s)) solid transparent; border-right: calc(13px * var(--s)) solid transparent; border-bottom: calc(22px * var(--s)) solid var(--c); background: none; border-radius: 0; }
  .deco { position: absolute; pointer-events: none; z-index: 1; }
  .deco .b-o { fill: var(--yellow); }
  .deco .b-r { fill: var(--red); }
  .deco .dots circle { fill: #fff; }
  .deco .arc, .deco .lines { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; }
  .deco .arc-y { fill: none; stroke: var(--navy); stroke-width: 12; stroke-linecap: round; }
  .inner { position: relative; z-index: 2; height: 100%; }
  .kicker { font-family: "Poppins", sans-serif; font-weight: 800; letter-spacing: .2em; color: var(--navy); background: var(--soft); border-radius: 999px; border: 3px solid var(--navy); display: inline-block; }
  .event { font-weight: 900; letter-spacing: .03em; white-space: nowrap; }
  .event b { font-family: "Poppins", sans-serif; color: #fff; background: var(--navy); padding: 0 .22em; border-radius: .2em; display: inline-block; transform: rotate(-4deg); margin: 0 .12em; }

  .art { position: relative; }
  .art > svg { position: absolute; filter: drop-shadow(6px 6px 0 rgba(22,22,22,.9)); }
  .mug { filter: drop-shadow(10px 10px 0 rgba(22,22,22,.12)) !important; }
  .bubble { position: absolute; font-family: "Poppins", sans-serif; font-weight: 900; color: var(--ink); background: #fff; border: 5px solid var(--ink); border-radius: 999px; box-shadow: 6px 6px 0 var(--ink); white-space: nowrap; transform: rotate(-8deg); }
  .bubble::after { content: ""; position: absolute; left: 30%; bottom: -22px; border-width: 22px 18px 0 0; border-style: solid; border-color: var(--ink) transparent transparent transparent; }

  .cb { position: relative; font-family: "Poppins", sans-serif; font-weight: 900; line-height: .98; display: flex; flex-direction: column; align-items: center; }
  .cb .w1, .cb .w2 { display: flex; }
  .cb i { font-style: normal; display: inline-block; transform: rotate(var(--r)); -webkit-text-stroke: .045em var(--ink); paint-order: stroke fill; text-shadow: .06em .06em 0 var(--ink); margin: 0 -.01em; }
  .c-n { color: var(--navy); } .c-r { color: var(--red); } .c-o { color: var(--yellow); }
  .badge { position: absolute; transform: rotate(14deg); }
  .badge svg { width: 100%; height: 100%; display: block; }
  .badge .b-n { position: absolute; left: 0; right: 0; text-align: center; font-family: "Poppins", sans-serif; font-weight: 900; color: var(--navy); line-height: 1; }
  .badge .b-u { position: absolute; left: 0; right: 0; text-align: center; font-family: "Poppins", sans-serif; font-weight: 800; color: var(--ink); letter-spacing: .1em; line-height: 1; }

  .rest { font-weight: 900; letter-spacing: .08em; white-space: nowrap; }
  .rest b { font-family: "Poppins", sans-serif; color: var(--red); font-size: 1.4em; padding: 0 .1em; background: linear-gradient(transparent 60%, var(--yellow) 60%, var(--yellow) 90%, transparent 90%); }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; }
  .chip { display: inline-flex; align-items: center; font-weight: 900; border: 5px solid var(--ink); border-radius: 999px; box-shadow: 6px 6px 0 var(--ink); white-space: nowrap; background: #fff; }
  .chip svg { background: #fff; border-radius: 50%; border: 4px solid var(--ink); flex: none; }
  .k1 { background: var(--navy); color: #fff; transform: rotate(-3deg); }
  .k2 { background: var(--yellow); color: var(--ink); transform: rotate(2deg); }
  .k3 { background: var(--red); color: #fff; transform: rotate(-2deg); }

  .tape { position: absolute; z-index: 3; left: -40px; right: -40px; background: var(--navy); border-block: 5px solid var(--ink); box-shadow: 0 8px 0 var(--ink);
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: .06em; white-space: nowrap; overflow: hidden; }
  .tape b { font-family: "Poppins", sans-serif; color: var(--yellow); }
  .tape .s { color: var(--yellow); }
  .tape .fl { color: var(--orange); }
  /* 橫式電視 33.867 × 19.05 cm（1920 × 1080 px） */
  @page { size: 338.67mm 190.5mm; margin: 0; }
  @media print { html, body { background: none; } body { padding: 0; display: block; } .sheet { box-shadow: none !important; zoom: .6666; } }
  .sheet { width: 1920px; height: 1080px; }
  .bg::after { background: radial-gradient(ellipse at 50% 50%, #FFF8E6 0, rgba(255,248,230,.85) 40%, transparent 75%); }
  .d-tl { width: 260px; top: -80px; left: -70px; } .d-tr { width: 300px; top: -110px; right: -60px; } .d-bl { width: 260px; bottom: -40px; left: -50px; } .d-br { width: 260px; bottom: -50px; right: -40px; }
  .inner { display: grid; grid-template-columns: 760px 1fr; grid-template-rows: auto auto auto; align-content: start; column-gap: 20px; padding: 50px 110px 0 150px; }
  .kicker { grid-column: 1 / -1; justify-self: start; font-size: 18px; padding: 5px 22px; }
  .event { grid-column: 1 / -1; margin-top: 12px; font-size: 40px; }
  .art { grid-column: 1; grid-row: 3; margin-top: 30px; width: 760px; height: 700px; }
  .mug { left: 150px; top: 120px; width: 470px; height: 470px; }
  .donut { left: 0; top: 470px; width: 180px; height: 180px; transform: rotate(-14deg); }
  .cookie { right: 20px; top: 500px; width: 140px; height: 140px; transform: rotate(10deg); }
  .bean { left: 60px; top: 150px; width: 70px; height: 94px; transform: rotate(-30deg); }
  .heart { right: 70px; top: 120px; width: 80px; height: 80px; transform: rotate(14deg); }
  .bubble { left: 10px; top: 30px; font-size: 38px; padding: 10px 28px; }
  .main { grid-column: 2; grid-row: 3; display: flex; flex-direction: column; align-items: center; margin-top: 80px; }
  .cb { font-size: 176px; }
  .badge { right: -210px; top: -95px; width: 210px; height: 210px; }
  .badge .b-n { top: 46px; font-size: 90px; }
  .badge .b-u { top: 134px; font-size: 28px; }
  .rest { margin-top: 40px; font-size: 80px; }
  .chips { margin-top: 44px; gap: 16px; flex-wrap: nowrap; }
  .chip { gap: 10px; font-size: 30px; padding: 6px 22px 6px 8px; }
  .chip svg { width: 54px; height: 54px; padding: 4px; }
  .tape { bottom: 18px; transform: rotate(-1deg); gap: 24px; padding: 8px 0; font-size: 28px; border-block-width: 4px; box-shadow: 0 6px 0 var(--ink); }
  .tape svg { width: 24px; height: 24px; flex: none; }
</style>
