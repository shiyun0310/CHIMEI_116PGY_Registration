<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Break 橫式</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --navy:#213C8F; --orange:#FFA319; --red:#F2541B; --yellow:#FFC83D; --ink:#161616; --soft:#F6F8FC; --brown:#6B3E1F; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9ecf3; }
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; display: flex; justify-content: center; padding: 16px; }
  .sheet { position: relative; overflow: hidden; background: #FFF4D6; color: var(--ink); box-shadow: 0 18px 40px -18px rgba(23,43,106,.45); }
  .bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, #fff 0, #fff 30%, transparent 70%); }
  .deco { position: absolute; pointer-events: none; }
  .deco .b-o { fill: var(--yellow); }
  .deco .b-r { fill: var(--orange); }
  .deco .dots circle { fill: #fff; }
  .deco .arc, .deco .lines { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; }
  .deco .arc-y { fill: none; stroke: var(--navy); stroke-width: 12; stroke-linecap: round; }
  .inner { position: relative; z-index: 2; height: 100%; }
  .kicker { font-family: "Poppins", sans-serif; font-weight: 800; letter-spacing: .2em; color: var(--navy); background: var(--soft); border-radius: 999px; border: 3px solid var(--navy); display: inline-block; }
  .event { font-weight: 900; letter-spacing: .03em; white-space: nowrap; }
  .event b { font-family: "Poppins", sans-serif; color: #fff; background: var(--navy); padding: 0 .22em; border-radius: .2em; display: inline-block; transform: rotate(-4deg); margin: 0 .12em; }
  .cup-wrap { position: relative; }
  .ring { position: absolute; inset: 0; border-radius: 50%; background: var(--orange); border: 6px solid var(--ink); box-shadow: 12px 12px 0 var(--ink); }
  .ring::after { content: ""; position: absolute; inset: 8%; border-radius: 50%; background: #fff; border: 5px solid var(--ink); }
  .cup { position: absolute; inset: 20%; width: 60%; height: 60%; color: var(--ink); }
  .cb { font-family: "Poppins", sans-serif; font-weight: 900; line-height: .95; letter-spacing: -.01em; color: var(--navy); -webkit-text-stroke: .04em #fff; paint-order: stroke fill; text-shadow: .05em .05em 0 var(--orange); }
  .rest { font-weight: 900; letter-spacing: .06em; }
  .rest b { font-family: "Poppins", sans-serif; color: var(--red); font-size: 1.35em; padding: 0 .08em; background: linear-gradient(transparent 62%, var(--yellow) 62%, var(--yellow) 92%, transparent 92%); }
  .time { display: inline-flex; align-items: center; font-family: "Poppins", sans-serif; font-weight: 800; color: #fff; background: var(--navy); border: 5px solid var(--ink); border-radius: 999px; box-shadow: 8px 8px 0 var(--ink); }
  .time svg { background: #fff; border-radius: 50%; border: 4px solid var(--ink); }
  .sub { font-weight: 700; color: #5a4632; }
  .next { display: inline-flex; align-items: center; font-weight: 900; color: var(--ink); background: #fff; border: 5px solid var(--ink); border-radius: 22px; box-shadow: 8px 8px 0 var(--ink); }
  .next span { font-family: "Poppins", sans-serif; color: #fff; background: var(--red); border-radius: 12px; }
  .tape { position: absolute; z-index: 3; left: -40px; right: -40px; background: var(--navy); border-block: 5px solid var(--ink); box-shadow: 0 8px 0 var(--ink);
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: .06em; white-space: nowrap; overflow: hidden; }
  .tape b { font-family: "Poppins", sans-serif; color: var(--yellow); }
  .tape .s { color: var(--yellow); }
  .tape .fl { color: var(--orange); }

  /* 橫式電視 33.867 × 19.05 cm（1920 × 1080 px） */
  @page { size: 338.67mm 190.5mm; margin: 0; }
  @media print { html, body { background: none; } body { padding: 0; display: block; } .sheet { box-shadow: none !important; zoom: .6666; } }
  .sheet { width: 1920px; height: 1080px; }
  .bg { background: radial-gradient(circle at 40% 45%, #fff 0, #fff 25%, transparent 65%); }
  .d-tl { width: 260px; top: -80px; left: -70px; } .d-tr { width: 300px; top: -110px; right: -60px; } .d-bl { width: 260px; bottom: -40px; left: -50px; } .d-br { width: 260px; bottom: -50px; right: -40px; }
  .inner { display: grid; grid-template-columns: 480px 1fr; grid-template-rows: auto auto auto; column-gap: 100px; align-items: center; align-content: start; padding: 50px 120px 0 160px; }
  .kicker { grid-column: 1 / -1; justify-self: start; font-size: 18px; padding: 5px 22px; }
  .event { grid-column: 1 / -1; margin-top: 12px; font-size: 40px; }
  .cup-wrap { grid-column: 1; grid-row: 3; margin-top: 30px; width: 460px; height: 460px; }
  .main { grid-column: 2; grid-row: 3; display: flex; flex-direction: column; align-items: flex-start; margin-top: 30px; }
  .cb { font-size: 150px; }
  .rest { margin-top: 18px; font-size: 64px; }
  .time { margin-top: 22px; gap: 16px; font-size: 46px; padding: 8px 40px 8px 12px; }
  .time svg { width: 62px; height: 62px; padding: 4px; }
  .sub { margin-top: 20px; font-size: 32px; }
  .next { margin-top: 18px; gap: 14px; font-size: 28px; padding: 10px 24px 10px 10px; }
  .next span { font-size: 28px; padding: 2px 12px; }
  .tape { bottom: 18px; transform: rotate(-1deg); gap: 24px; padding: 8px 0; font-size: 28px; border-block-width: 4px; box-shadow: 0 6px 0 var(--ink); }
  .tape svg { width: 24px; height: 24px; flex: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-coffee" viewBox="0 0 64 64"><path d="M10 28h36v12a16 16 0 0 1-16 16h-4a16 16 0 0 1-16-16z" fill="#FFB21C" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M46 32h4a7 7 0 0 1 0 14h-6" fill="none" stroke="currentColor" stroke-width="4"/><path class="steam" d="M20 20c-3-4 3-6 0-12M30 20c-3-4 3-6 0-12M40 20c-3-4 3-6 0-12" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></symbol>

<div class="sheet">
  <div class="bg"></div>
  <svg class="deco d-tl" viewBox="0 0 300 300" aria-hidden="true"><path class="b-o" d="M40 60c40-50 120-30 130 20s-40 70-30 120-90 70-120 20S0 110 40 60z"/><g class="dots"><circle cx="70" cy="100" r="7"/><circle cx="100" cy="80" r="5"/><circle cx="60" cy="150" r="6"/><circle cx="110" cy="130" r="5"/><circle cx="85" cy="190" r="7"/></g><path class="arc" d="M120 160a20 20 0 0 1 28 0M50 210a18 18 0 0 1 26 0"/></svg>
  <svg class="deco d-tr" viewBox="0 0 360 300" aria-hidden="true"><path class="b-r" d="M120 0h240v200c-30 40-80 10-100 50s-90 40-90-10 40-60 10-90-90-20-80-70S90 20 120 0z"/><path class="lines" d="M220 40c10 20 30 20 40 40M280 70c8 16 26 16 34 30M180 120c12 10 26 12 36 4"/></svg>
  <svg class="deco d-bl" viewBox="0 0 320 300" aria-hidden="true"><path class="b-r" d="M0 120c50-30 100 10 130 60s70 50 60 100-160 30-190 20z"/><path class="arc-y" d="M150 90a50 50 0 0 1 70 70M150 120a26 26 0 0 1 40 36"/></svg>
  <svg class="deco d-br" viewBox="0 0 320 300" aria-hidden="true"><path class="b-o" d="M320 80c-60 0-90 40-110 90s-80 40-80 90 50 50 190 40z"/><g class="dots"><circle cx="250" cy="170" r="7"/><circle cx="280" cy="140" r="5"/><circle cx="220" cy="230" r="6"/><circle cx="270" cy="250" r="7"/></g></svg>
  <div class="inner">
    <p class="kicker">CHI MEI MEDICAL CENTER</p>
    <p class="event">奇美醫院西醫<b>PGY</b>醫師招募說明會</p>
    <div class="cup-wrap"><span class="ring"></span><svg class="cup"><use href="#i-coffee"/></svg></div>
    <div class="main">
      <h1 class="cb">Coffee<br>Break</h1>
      <p class="rest">休息 <b>15</b> 分鐘</p>
      <p class="time"><svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="24" fill="#FFB21C" stroke="#161616" stroke-width="4"/><path d="M32 34V20M32 34h10" stroke="#161616" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="34" r="3" fill="#161616"/></svg>14:50 – 15:05</p>

</div>

</html>
