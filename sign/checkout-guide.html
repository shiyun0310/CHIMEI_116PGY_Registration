<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簽退說明</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* A4 直式簽退＋滿意度說明公告（藍色系、淡藍底，與簽到錯開）（210 × 297 mm），列印請選「實際大小」、無邊界 */
  @page { size: 210mm 297mm; margin: 0; }
  :root { --navy:#213C8F; --orange:#FFA319; --red:#F2541B; --yellow:#FFC83D; --ink:#161616; --soft:#F6F8FC; --green:#1E9E5A; --sky:#5B8DEF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9ecf3; }
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact;
    display: flex; justify-content: center; padding: 16px; }
  @media print { html, body { background: none; } body { padding: 0; display: block; } .sheet { box-shadow: none !important; } }

  .sheet { position: relative; overflow: hidden; width: 210mm; height: 297mm; background: #DDE8FF; color: var(--ink);
    box-shadow: 0 18px 40px -18px rgba(23,43,106,.45); }
  .bg { position: absolute; inset: 0; background: url("../assets/img/building-sky-960.webp") center 30% / cover no-repeat; opacity: .08;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.4), #000 35%, rgba(0,0,0,.1)); mask-image: linear-gradient(180deg, rgba(0,0,0,.4), #000 35%, rgba(0,0,0,.1)); }

  .deco { position: absolute; pointer-events: none; }
  .deco .b-o { fill: var(--navy); }
  .deco .b-r { fill: var(--sky); }
  .deco .dots circle { fill: #fff; }
  .deco .arc, .deco .lines { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; }
  .deco .arc-y { fill: none; stroke: var(--yellow); stroke-width: 12; stroke-linecap: round; }
  .d-tl { width: 62mm; top: -18mm; left: -16mm; }
  .d-tr { width: 76mm; top: -22mm; right: -12mm; }
  .d-bl { width: 66mm; bottom: -6mm; left: -8mm; }
  .d-br { width: 66mm; bottom: -8mm; right: -6mm; }

  .inner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 16mm 16mm 0; }
  .kicker { font-family: "Poppins", sans-serif; font-weight: 800; letter-spacing: .2em; font-size: 3.4mm; color: var(--navy);
    background: var(--soft); padding: .9mm 4mm; border-radius: 999px; border: .45mm solid var(--navy); }
  .event { margin-top: 3mm; font-weight: 900; font-size: 7.6mm; letter-spacing: .03em; white-space: nowrap; }
  .event b { font-family: "Poppins", sans-serif; color: #fff; background: var(--navy); padding: 0 .22em; border-radius: .2em; display: inline-block; transform: rotate(-4deg); margin: 0 .12em; }

  .title { position: relative; margin-top: 3mm; font-weight: 900; font-size: 16mm; line-height: 1.15; letter-spacing: .06em; color: var(--navy); }
  .title span { padding: 0 .06em; background: linear-gradient(transparent 60%, var(--yellow) 60%, var(--yellow) 92%, transparent 92%); }
  .title .tag { position: absolute; right: -27mm; top: -3mm; font-family: "Poppins", sans-serif; font-size: 4.2mm; letter-spacing: .06em; line-height: 1;
    color: var(--ink); background: #fff; border: .6mm solid var(--ink); border-radius: 999px; padding: 1.5mm 3.4mm; box-shadow: 1mm 1mm 0 var(--ink); transform: rotate(8deg); }
  .qr-row { margin-top: 5mm; width: 100%; display: flex; align-items: center; gap: 7mm; text-align: left;
    background: var(--navy); color: #fff; border: .9mm solid var(--ink); border-radius: 7mm; box-shadow: 1.8mm 1.8mm 0 var(--ink); padding: 3mm 6mm 3mm 3mm; }
  .qr-box { flex: none; background: #fff; border: .8mm solid var(--ink); border-radius: 4mm; padding: 3mm; }
  .qr { display: block; width: 34mm; height: 34mm; }
  .qr-tag { display: inline-block; font-family: "Poppins", sans-serif; font-weight: 800; font-size: 4mm; letter-spacing: .12em; color: var(--ink);
    background: var(--yellow); border-radius: 999px; padding: .6mm 3.4mm; }
  .qr-txt h2 { margin-top: 2.4mm; font-size: 9.6mm; font-weight: 900; line-height: 1.25; letter-spacing: .02em; }
  .qr-txt h2 b { font-family: "Poppins", sans-serif; color: var(--yellow); }
  .qr-txt p { margin-top: 1.6mm; font-size: 4.8mm; font-weight: 700; opacity: .92; line-height: 1.45; }
  .lead { margin-top: 4mm; font-size: 5.4mm; font-weight: 700; color: #3a4052; }

  /* 步驟 */
  .steps { margin-top: 4mm; width: 100%; display: flex; flex-direction: column; gap: 4mm; }
  .step { position: relative; display: flex; align-items: center; gap: 6mm; text-align: left;
    background: #fff; border: .9mm solid var(--ink); border-radius: 7mm; box-shadow: 1.8mm 1.8mm 0 var(--ink); padding: 1.6mm 6mm 1.6mm 5mm; }
  .num { flex: none; width: 13mm; height: 13mm; border-radius: 50%; display: grid; place-items: center;
    font-family: "Poppins", sans-serif; font-weight: 900; font-size: 9.5mm; color: #fff; border: .8mm solid var(--ink); }
  .s1 .num { background: var(--navy); }
  .s2 .num { background: var(--sky); }
  .s3 .num { background: var(--yellow); color: var(--ink); }
  .s4 .num { background: var(--green); }
  .txt { flex: 1; }
  .txt h3 { font-size: 7.4mm; font-weight: 900; line-height: 1.3; letter-spacing: .02em; }
  .txt h3 em { font-style: normal; color: #2F6FE0; }
  .txt p { margin-top: .4mm; font-size: 4.2mm; font-weight: 700; color: #4a5266; line-height: 1.45; }
  .ill { flex: none; width: 19mm; height: 19mm; }
  .arrow { position: absolute; left: calc(50% - 3mm); bottom: -4.6mm; width: 5mm; height: 3.6mm; z-index: 2; }

  .enter { margin-top: 4mm; display: inline-flex; align-items: center; gap: 3mm; font-weight: 900; font-size: 8mm; letter-spacing: .04em;
    color: #fff; background: var(--green); border: .9mm solid var(--ink); border-radius: 999px; padding: 2.4mm 9mm 2.4mm 4mm; box-shadow: 1.8mm 1.8mm 0 var(--ink); transform: rotate(-2deg); }
  .enter b { color: var(--yellow); }
  .enter svg { width: 11mm; height: 11mm; background: #fff; border-radius: 50%; border: .6mm solid var(--ink); padding: 1.4mm; }
  .note { margin-top: 3mm; font-size: 4.4mm; font-weight: 700; color: #4a5266; }

  .tape { position: absolute; z-index: 3; left: -8mm; right: -8mm; bottom: 12mm; background: var(--sky); border-block: .8mm solid var(--ink); box-shadow: 0 1.3mm 0 var(--ink);
    transform: rotate(-3deg); color: #fff; display: flex; align-items: center; justify-content: center; gap: 4.5mm;
    padding: 2mm 0; font-weight: 900; font-size: 6mm; letter-spacing: .06em; white-space: nowrap; overflow: hidden; }
  .tape b { font-family: "Poppins", sans-serif; color: var(--yellow); text-shadow: 0 .3mm 0 var(--ink); }
  .lead .hl { color: var(--navy); background: linear-gradient(transparent 60%, var(--yellow) 60%); padding: 0 .1em; }
  .tape svg { width: 5mm; height: 5mm; flex: none; }
  .tape .s { color: var(--yellow); }
  .tape .fl { color: var(--orange); }
</style>
</head>

    <h1 class="title"><span>簽退說明</span><i class="tag">CHECK-OUT</i></h1>

m2 0h3m3 0h1m2 0h2M0 30.5h7m1 0h1m1 0h4m1 0h2m1 0h1m1 0h7m1 0h1m1 0h1m1 0h1M0 31.5h1m5 0h1m2 0h3m1 0h2m4 0h1m1 0h1m1 0h1m2 0h1m1 0h1m3 0h3M0 32.5h1m1 0h3m1 0h1m1 0h2m4 0h1m1 0h1m2 0h2m2 0h1m4 0h7M0 33.5h1m1 0h3m1 0h1m2 0h3m1 0h2m3 0h2m1 0h3m1 0h1m1 0h1m1 0h3m4 0h1M0 34.5h1m1 0h3m1 0h1m2 0h4m2 0h1m1 0h1m1 0h1m3 0h5m2 0h1M0 35.5h1m5 0h1m4 0h11m1 0h2m1 0h2m2 0h1m1 0h1m1 0h2M0 36.5h7m1 0h2m4 0h1m1 0h3m1 0h1m1 0h1m1 0h1m2 0h1m1 0h1m1 0h1m1 0h4"/></svg></div>
      <div class="qr-txt">
        <span class="qr-tag">STEP 0</span>
        <h2>手機掃描 <b>QR Code</b></h2>
        <p>開啟簽退頁面，依下列步驟完成簽退</p>
      </div>
    </div>

    <div class="steps">
      <div class="step s1">
        <span class="num">1</span>
        <div class="txt">
          <h3>輸入<em>姓名</em>查詢</h3>
          <p>系統會自動帶出您的報名資料<br>請確認是本人資料</p>
        </div>
        <!-- 手機＋放大鏡 -->
        <svg class="ill" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="12" y="4" width="32" height="56" rx="6" fill="#fff" stroke="#161616" stroke-width="3.5"/>
          <rect x="17" y="15" width="22" height="7" rx="2" fill="#F6F8FC" stroke="#213C8F" stroke-width="2"/>

          <path d="M17 28h22M17 34h16M17 40h19" stroke="#c5cbd8" stroke-width="2.5" stroke-linecap="round"/>

        <svg class="arrow"><use href="#i-down"/></svg>

        </div>
        <!-- 問卷 -->
        <svg class="ill" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="10" y="8" width="40" height="52" rx="5" fill="#fff" stroke="#161616" stroke-width="3.5"/>
          <rect x="22" y="3" width="16" height="10" rx="3" fill="#5B8DEF" stroke="#161616" stroke-width="3"/>
          <rect x="16" y="21" width="7" height="7" rx="1.5" fill="#1E9E5A"/><path d="M17.5 24.5l1.6 1.6 3-3.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

          <rect x="16" y="33" width="7" height="7" rx="1.5" fill="#1E9E5A"/><path d="M17.5 36.5l1.6 1.6 3-3.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M27 36.5h12" stroke="#c5cbd8" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M18 50l1.5 3 3.3.5-2.4 2.3.6 3.3-3-1.6-3 1.6.6-3.3L13.2 53.5l3.3-.5z" fill="#FFC83D" stroke="#161616" stroke-width="1.4" stroke-linejoin="round"/>

      <div class="step s3">
        <span class="num">3</span>
        <div class="txt">

        </svg>

    </div>

    <p class="enter"><svg viewBox="0 0 64 64" aria-hidden="true" style="color:#161616"><rect x="9" y="28" width="46" height="30" rx="4" fill="#F2541B" stroke="currentColor" stroke-width="4"/><rect x="5" y="19" width="54" height="11" rx="3" fill="#FFB21C" stroke="currentColor" stroke-width="4"/><path d="M32 19v39" stroke="currentColor" stroke-width="4"/><path d="M32 19c-4-10-17-14-17-6s13 6 17 6zM32 19c4-10 17-14 17-6s-13 6-17 6z" fill="#fff" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/></svg><span>記得至<b>報到台</b>領取與會禮！</span></p>
