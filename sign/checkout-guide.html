<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簽退說明</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* A4 直式簽退＋滿意度說明公告（藍色系、淡藍底，與簽到錯開）（210 × 297 mm），列印請選「實際大小」、無邊界 */
  @page { size: 210mm 297mm; margin: 0; }
  :root { --navy:#213C8F; --orange:#FFA319; --red:#F2541B; --yellow:#FFC83D; --ink:#161616; --soft:#F6F8FC; --green:#1E9E5A; --sky:#5B8DEF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9ecf3; }
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact;
    display: flex; justify-content: center; padding: 16px; }
  @media print { html, body { background: none; } body { padding: 0; display: block; } .sheet { box-shadow: none !important; } }

  .sheet { position: relative; overflow: hidden; width: 210mm; height: 297mm; background: #DDE8FF; color: var(--ink);
    box-shadow: 0 18px 40px -18px rgba(23,43,106,.45); }
  .bg { position: absolute; inset: 0; background: url("../assets/img/building-sky-960.webp") center 30% / cover no-repeat; opacity: .08;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.4), #000 35%, rgba(0,0,0,.1)); mask-image: linear-gradient(180deg, rgba(0,0,0,.4), #000 35%, rgba(0,0,0,.1)); }

  .deco { position: absolute; pointer-events: none; }
  .deco .b-o { fill: var(--navy); }
  .deco .b-r { fill: var(--sky); }
  .deco .dots circle { fill: #fff; }
  .deco .arc, .deco .lines { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; }
  .deco .arc-y { fill: none; stroke: var(--yellow); stroke-width: 12; stroke-linecap: round; }
  .d-tl { width: 62mm; top: -18mm; left: -16mm; }
  .d-tr { width: 76mm; top: -22mm; right: -12mm; }
  .d-bl { width: 66mm; bottom: -6mm; left: -8mm; }
  .d-br { width: 66mm; bottom: -8mm; right: -6mm; }

  .inner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18mm 16mm 0; }
  .kicker { font-family: "Poppins", sans-serif; font-weight: 800; letter-spacing: .2em; font-size: 3.4mm; color: var(--navy);
    background: var(--soft); padding: .9mm 4mm; border-radius: 999px; border: .45mm solid var(--navy); }
  .event { margin-top: 3mm; font-weight: 900; font-size: 7.6mm; letter-spacing: .03em; white-space: nowrap; }
  .event b { font-family: "Poppins", sans-serif; color: #fff; background: var(--navy); padding: 0 .22em; border-radius: .2em; display: inline-block; transform: rotate(-4deg); margin: 0 .12em; }

  .title { position: relative; margin-top: 5mm; font-weight: 900; font-size: 19mm; line-height: 1.15; letter-spacing: .06em; color: var(--navy); }
  .title span { padding: 0 .06em; background: linear-gradient(transparent 60%, var(--yellow) 60%, var(--yellow) 92%, transparent 92%); }
  .title .tag { position: absolute; right: -27mm; top: -3mm; font-family: "Poppins", sans-serif; font-size: 4.2mm; letter-spacing: .06em; line-height: 1;
    color: var(--ink); background: #fff; border: .6mm solid var(--ink); border-radius: 999px; padding: 1.5mm 3.4mm; box-shadow: 1mm 1mm 0 var(--ink); transform: rotate(8deg); }
  .lead { margin-top: 4mm; font-size: 5.4mm; font-weight: 700; color: #3a4052; }

  /* 步驟 */
  .steps { margin-top: 6mm; width: 100%; display: flex; flex-direction: column; gap: 5mm; }
  .step { position: relative; display: flex; align-items: center; gap: 6mm; text-align: left;
    background: #fff; border: .9mm solid var(--ink); border-radius: 7mm; box-shadow: 1.8mm 1.8mm 0 var(--ink); padding: 2.4mm 6mm 2.4mm 5mm; }
  .num { flex: none; width: 15mm; height: 15mm; border-radius: 50%; display: grid; place-items: center;
    font-family: "Poppins", sans-serif; font-weight: 900; font-size: 9.5mm; color: #fff; border: .8mm solid var(--ink); }
  .s1 .num { background: var(--navy); }
  .s2 .num { background: var(--sky); }
  .s3 .num { background: var(--yellow); color: var(--ink); }
  .s4 .num { background: var(--green); }
  .txt { flex: 1; }
  .txt h3 { font-size: 7.8mm; font-weight: 900; line-height: 1.3; letter-spacing: .02em; }
  .txt h3 em { font-style: normal; color: #2F6FE0; }
  .txt p { margin-top: .6mm; font-size: 4.4mm; font-weight: 700; color: #4a5266; line-height: 1.45; }
  .ill { flex: none; width: 22mm; height: 22mm; }
  .arrow { position: absolute; left: calc(50% - 3mm); bottom: -5.6mm; width: 5.4mm; height: 4.2mm; z-index: 2; }

  .enter { margin-top: 5.5mm; display: inline-flex; align-items: center; gap: 3mm; font-weight: 900; font-size: 8mm; letter-spacing: .04em;
    color: #fff; background: var(--green); border: .9mm solid var(--ink); border-radius: 999px; padding: 2.4mm 9mm 2.4mm 4mm; box-shadow: 1.8mm 1.8mm 0 var(--ink); transform: rotate(-2deg); }
  .enter svg { width: 11mm; height: 11mm; background: #fff; border-radius: 50%; border: .6mm solid var(--ink); padding: 1.4mm; }
  .note { margin-top: 4.5mm; font-size: 4.4mm; font-weight: 700; color: #4a5266; }

  .tape { position: absolute; z-index: 3; left: -8mm; right: -8mm; bottom: 12mm; background: var(--sky); border-block: .8mm solid var(--ink); box-shadow: 0 1.3mm 0 var(--ink);
    transform: rotate(-3deg); color: #fff; display: flex; align-items: center; justify-content: center; gap: 4.5mm;
    padding: 2mm 0; font-weight: 900; font-size: 6mm; letter-spacing: .06em; white-space: nowrap; overflow: hidden; }
  .tape b { font-family: "Poppins", sans-serif; color: var(--yellow); text-shadow: 0 .3mm 0 var(--ink); }
  .lead .hl { color: var(--navy); background: linear-gradient(transparent 60%, var(--yellow) 60%); padding: 0 .1em; }
  .tape svg { width: 5mm; height: 5mm; flex: none; }
  .tape .s { color: var(--yellow); }
  .tape .fl { color: var(--orange); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 4l7 19 21 1-16 13 6 21-18-12-18 12 6-21L4 24l21-1z" fill="currentColor"/></symbol>
  <symbol id="i-flower" viewBox="0 0 64 64"><path d="M32 30C20 4 44 4 32 30 58 18 58 46 32 34 44 60 20 60 32 34 6 46 6 18 32 30z" fill="currentColor"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 20"><path d="M2 3h20L12 18z" fill="#5B8DEF" stroke="#161616" stroke-width="2.5" stroke-linejoin="round"/></symbol>
</defs></svg>

<div class="sheet">
  <div class="bg"></div>
  <svg class="deco d-tl" viewBox="0 0 300 300" aria-hidden="true"><path class="b-o" d="M40 60c40-50 120-30 130 20s-40 70-30 120-90 70-120 20S0 110 40 60z"/><g class="dots"><circle cx="70" cy="100" r="7"/><circle cx="100" cy="80" r="5"/><circle cx="60" cy="150" r="6"/><circle cx="110" cy="130" r="5"/><circle cx="85" cy="190" r="7"/></g><path class="arc" d="M120 160a20 20 0 0 1 28 0M50 210a18 18 0 0 1 26 0"/></svg>
  <svg class="deco d-tr" viewBox="0 0 360 300" aria-hidden="true"><path class="b-r" d="M120 0h240v200c-30 40-80 10-100 50s-90 40-90-10 40-60 10-90-90-20-80-70S90 20 120 0z"/><path class="lines" d="M220 40c10 20 30 20 40 40M280 70c8 16 26 16 34 30M180 120c12 10 26 12 36 4"/></svg>
  <svg class="deco d-bl" viewBox="0 0 320 300" aria-hidden="true"><path class="b-r" d="M0 120c50-30 100 10 130 60s70 50 60 100-160 30-190 20z"/><path class="arc-y" d="M150 90a50 50 0 0 1 70 70M150 120a26 26 0 0 1 40 36"/></svg>
  <svg class="deco d-br" viewBox="0 0 320 300" aria-hidden="true"><path class="b-o" d="M320 80c-60 0-90 40-110 90s-80 40-80 90 50 50 190 40z"/><g class="dots"><circle cx="250" cy="170" r="7"/><circle cx="280" cy="140" r="5"/><circle cx="220" cy="230" r="6"/><circle cx="270" cy="250" r="7"/></g></svg>

  <div class="inner">
    <p class="kicker">CHI MEI MEDICAL CENTER</p>
    <p class="event">西醫<b>PGY</b>醫師招募說明會</p>

    <h1 class="title"><span>簽退說明</span><i class="tag">CHECK-OUT</i></h1>
    <p class="lead">請用手機開啟簽退頁面，完成<b class="hl">滿意度調查</b>即簽退</p>

    <div class="steps">
      <div class="step s1">
        <span class="num">1</span>
        <div class="txt">
          <h3>輸入<em>姓名</em>查詢</h3>
          <p>系統會自動帶出您的報名資料<br>請確認是本人資料</p>
        </div>
        <!-- 手機＋放大鏡 -->
        <svg class="ill" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="12" y="4" width="32" height="56" rx="6" fill="#fff" stroke="#161616" stroke-width="3.5"/>
          <rect x="17" y="15" width="22" height="7" rx="2" fill="#F6F8FC" stroke="#213C8F" stroke-width="2"/>
          <path d="M20 18.5h9" stroke="#213C8F" stroke-width="2" stroke-linecap="round"/>
          <path d="M17 28h22M17 34h16M17 40h19" stroke="#c5cbd8" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M24 9h8" stroke="#161616" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="46" cy="40" r="9" fill="#FFC83D" stroke="#161616" stroke-width="3.5"/>
          <path d="M52.5 46.5 60 54" stroke="#161616" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <svg class="arrow"><use href="#i-down"/></svg>
      </div>

      <div class="step s2">
        <span class="num">2</span>
        <div class="txt">
          <h3>填寫<em>滿意度問卷</em></h3>
          <p>滿意度、心得建議與甄試意願<br>約 2 分鐘即可完成</p>
        </div>
        <!-- 問卷 -->
        <svg class="ill" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="10" y="8" width="40" height="52" rx="5" fill="#fff" stroke="#161616" stroke-width="3.5"/>
          <rect x="22" y="3" width="16" height="10" rx="3" fill="#5B8DEF" stroke="#161616" stroke-width="3"/>
          <rect x="16" y="21" width="7" height="7" rx="1.5" fill="#1E9E5A"/><path d="M17.5 24.5l1.6 1.6 3-3.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M27 24.5h16" stroke="#c5cbd8" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="16" y="33" width="7" height="7" rx="1.5" fill="#1E9E5A"/><path d="M17.5 36.5l1.6 1.6 3-3.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M27 36.5h12" stroke="#c5cbd8" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M18 50l1.5 3 3.3.5-2.4 2.3.6 3.3-3-1.6-3 1.6.6-3.3L13.2 53.5l3.3-.5z" fill="#FFC83D" stroke="#161616" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M31 50l1.5 3 3.3.5-2.4 2.3.6 3.3-3-1.6-3 1.6.6-3.3-2.4-2.3 3.3-.5z" fill="#FFC83D" stroke="#161616" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M44 50l1.5 3 3.3.5-2.4 2.3.6 3.3-3-1.6-3 1.6.6-3.3-2.4-2.3 3.3-.5z" fill="#FFC83D" stroke="#161616" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <svg class="arrow"><use href="#i-down"/></svg>
      </div>

      <div class="step s3">
        <span class="num">3</span>
        <div class="txt">
          <h3>按下<em>「送出並簽退」</em></h3>
          <p>畫面出現「簽退成功」</p>
        </div>
        <!-- 手指點按鈕 -->
        <svg class="ill" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="4" y="12" width="48" height="18" rx="9" fill="#1E9E5A" stroke="#161616" stroke-width="3.5"/>
          <path d="M15 21h26" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M34 60V36a4 4 0 0 1 8 0v10l3-1.4a4 4 0 0 1 5 1.6l1 .8a4 4 0 0 1 5 2.4v1a4 4 0 0 1 4 4V60" fill="#FFD9B8" stroke="#161616" stroke-width="3.2" stroke-linejoin="round"/>
          <path d="M30 26l-3-4M38 25v-5M46 26l3-4" stroke="#FFA319" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <svg class="arrow"><use href="#i-down"/></svg>
      </div>

      <div class="step s4">
        <span class="num">4</span>
        <div class="txt">
          <h3>出示<em>簽退成功</em>畫面</h3>
          <p>請將手機畫面給工作人員確認</p>
        </div>
        <!-- 手機＋勾勾 -->
        <svg class="ill" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="14" y="4" width="36" height="56" rx="6" fill="#fff" stroke="#161616" stroke-width="3.5"/>
          <path d="M27 9h10" stroke="#161616" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="32" cy="29" r="10" fill="#1E9E5A"/>
          <path d="M27 29.5l3.4 3.4L37.5 25.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 45h20M25 51h14" stroke="#c5cbd8" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <p class="enter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#1FA463" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>確認後即完成簽退，感謝參與！</p>
    <p class="note">找不到報名資料或顯示尚未報到，請洽工作人員</p>
  </div>

  <div class="tape"><span>選擇奇美</span><svg class="s"><use href="#i-star"/></svg><span>創造 <b>360°</b> 醫學人生</span><svg class="fl"><use href="#i-flower"/></svg><span>選擇奇美</span><svg class="s"><use href="#i-star"/></svg><span>創造 <b>360°</b> 醫學人生</span></div>
</div>
</body>
</html>
