<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>奇美醫院116學年度西醫PGY醫師招募說明會 報名狀況</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4c15 0 28 9 28 26S47 60 30 60 4 48 4 32 17 4 32 4z' fill='%23213C8F'/%3E%3Cpath d='M18 44V30M28 44V20M38 44V26M48 44V14' stroke='%23FFB21C' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --navy: #213C8F; --navy-d: #172B6A; --orange: #FFA319; --red: #F2541B; --yellow: #FFC83D;
      --ink: #161616; --ink-2: #4A5060; --muted: #6B7180; --line: #E3E7EF; --grid: #EEF1F6;
      --bg: #F4F6FA; --card: #FFFFFF; --soft: #F6F8FC;
      --font: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      --font-en: "Poppins", var(--font);
      --gutter: clamp(16px, 3vw, 32px);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.55; }
    [hidden] { display: none !important; }
    button, input { font: inherit; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter); }

    /* header */
    .top { background: var(--navy); color: #fff; border-bottom: 4px solid var(--ink); position: relative; overflow: hidden; }
    .top::before { content: ""; position: absolute; width: 180px; height: 180px; right: -60px; top: -80px; border-radius: 46% 54% 60% 40%; background: var(--orange); }
    @media (max-width: 600px) { .top::before { width: 120px; height: 120px; right: -60px; top: -70px; } }
    .top::after { content: ""; position: absolute; width: 90px; height: 90px; right: 110px; bottom: -60px; border-radius: 58% 42% 40% 60%; background: var(--yellow); }
    .top .wrap { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding-block: 22px; }
    .top h1 { margin: 0; font-size: clamp(1.15rem, 2.8vw, 1.6rem); font-weight: 900; line-height: 1.3; }
    .top h1 small { display: block; font-family: var(--font-en); font-size: .62em; font-weight: 800; letter-spacing: .18em; color: var(--yellow); }
    .top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .updated { font-size: .85rem; opacity: .85; margin-right: 4px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 16px; border-radius: 999px;
      border: 2px solid var(--ink); background: #fff; color: var(--ink); font-weight: 700; cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink); transition: transform .12s, box-shadow .12s;
    }
    .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .btn:focus-visible, input:focus-visible { outline: 3px dashed var(--red); outline-offset: 2px; }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-ghost { background: transparent; color: #fff; border-color: #fff; box-shadow: none; }
    .btn[disabled] { opacity: .6; cursor: progress; }
    .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; display: none; animation: spin .8s linear infinite; }
    .loading .spin { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    main.wrap { padding-block: 24px 48px; }

    /* login */
    .login { max-width: 420px; margin: 8vh auto; background: var(--card); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 8px 8px 0 var(--navy); padding: 32px 28px; text-align: center; }
    .login h2 { margin: 0 0 6px; font-size: 1.4rem; font-weight: 900; }
    .login p { margin: 0 0 18px; color: var(--muted); }
    .login input { width: 100%; min-height: 48px; padding: 10px 14px; font-size: 16px; border: 2px solid var(--ink); border-radius: 14px; background: var(--soft); margin-bottom: 14px; }
    .login .btn { width: 100%; justify-content: center; min-height: 48px; }
    .err { color: var(--red); font-weight: 700; min-height: 1.5em; margin: 12px 0 0 !important; }

    /* cards */
    .grid { display: grid; gap: 16px; }
    .kpis { grid-template-columns: repeat(4, 1fr); margin-bottom: 16px; }
    .row2 { grid-template-columns: 2fr 1fr; margin-bottom: 16px; }
    .row3 { grid-template-columns: repeat(2, 1fr); margin-bottom: 16px; }
    @media (max-width: 960px) { .kpis { grid-template-columns: repeat(2, 1fr); } .row2, .row3 { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; min-width: 0; }
    .card h2 { margin: 0 0 2px; font-size: 1.02rem; font-weight: 900; }
    .card .sub { margin: 0 0 14px; font-size: .85rem; color: var(--muted); }

    .kpi { position: relative; overflow: hidden; }
    .kpi .label { font-size: .9rem; color: var(--ink-2); font-weight: 700; }
    .kpi .num { font-family: var(--font-en); font-size: clamp(2rem, 5vw, 2.6rem); font-weight: 800; line-height: 1.1; margin: 4px 0 2px; color: var(--ink); }
    .kpi .num small { font-family: var(--font); font-size: .42em; font-weight: 700; color: var(--muted); margin-left: 4px; }
    .kpi .note { font-size: .82rem; color: var(--muted); }
    .kpi::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--k, var(--navy)); }
    .kpi:nth-child(2) { --k: var(--red); } .kpi:nth-child(3) { --k: var(--orange); } .kpi:nth-child(4) { --k: var(--yellow); }

    /* daily chart */
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: 240px; overflow: visible; }
    .chart .gridline { stroke: var(--grid); stroke-width: 1; }
    .chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font-en); }
    .chart .bar { fill: var(--navy); }
    .chart .bar.today { fill: var(--red); }
    .chart .hit { fill: transparent; cursor: pointer; }
    .chart .hit:hover + .bar, .chart .bar.hover { fill: var(--navy-d); }
    .chart .baseline { stroke: #C9CFDB; stroke-width: 1; }
    .tip {
      position: absolute; pointer-events: none; z-index: 5; background: var(--ink); color: #fff; border-radius: 10px;
      padding: 6px 10px; font-size: .82rem; line-height: 1.4; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px));
      box-shadow: 0 6px 18px rgba(0,0,0,.18);
    }
    .tip b { font-family: var(--font-en); font-size: 1rem; }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; }

    /* horizontal bars */
    .hbars { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .hbar { display: grid; grid-template-columns: minmax(84px, 36%) 1fr auto; align-items: center; gap: 10px; font-size: .9rem; }
    .hbar .name { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hbar .track { display: block; height: 14px; background: var(--grid); border-radius: 4px; overflow: hidden; }
    .hbar .fill { display: block; height: 100%; background: var(--navy); border-radius: 0 4px 4px 0; min-width: 2px; transition: width .5s ease; }
    .hbar .val { font-family: var(--font-en); font-weight: 800; font-size: .9rem; min-width: 64px; text-align: right; }
    .hbar .val small { font-family: var(--font); font-weight: 500; color: var(--muted); margin-left: 4px; }
    .hbar.zero .name, .hbar.zero .val { color: #A3A9B6; }

    /* table */
    .tbl-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .tbl-head input { min-height: 40px; padding: 6px 14px; border: 2px solid var(--line); border-radius: 999px; width: min(320px, 100%); font-size: 16px; background: var(--soft); }
    .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: var(--soft); font-weight: 700; color: var(--ink-2); white-space: nowrap; position: sticky; top: 0; }
    tbody tr:hover { background: #FAFBFE; }
    td.nw { white-space: nowrap; }
    .hbar.zero .fill { min-width: 0; }
    td.num { font-family: var(--font-en); color: var(--muted); }
    td.time { white-space: nowrap; color: var(--ink-2); }
    td.mail { word-break: break-all; min-width: 180px; }
    td.long { min-width: 220px; max-width: 360px; white-space: pre-wrap; }
    .count { font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1><small>REGISTRATION DASHBOARD</small>奇美醫院116學年度西醫PGY醫師招募說明會 報名狀況</h1>
      <div class="top-actions" id="actions" hidden>
        <span class="updated" id="updated"></span>
        <button class="btn btn-primary" id="refresh" type="button"><span class="spin" aria-hidden="true"></span>重新整理</button>
        <button class="btn" id="xlsx" type="button">下載 Excel</button>
        <button class="btn btn-ghost" id="logout" type="button">登出</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- login -->
    <form class="login" id="login" hidden>
      <h2>請輸入密碼</h2>
      <p>此頁面含報名者個人資料，僅供承辦人員使用。</p>
      <input type="password" id="pw" autocomplete="current-password" aria-label="密碼" placeholder="儀表板密碼" required>
      <button class="btn btn-primary" type="submit" id="loginBtn"><span class="spin" aria-hidden="true"></span>進入</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>

    <!-- dashboard -->
    <div id="dash" hidden>
      <section class="grid kpis" aria-label="重點數字">
        <div class="card kpi"><div class="label">總報名人數</div><div class="num" id="kTotal">0<small>人</small></div><div class="note" id="kTotalNote">&nbsp;</div></div>
        <div class="card kpi"><div class="label">今日新增</div><div class="num" id="kToday">0<small>人</small></div><div class="note" id="kTodayNote">&nbsp;</div></div>
        <div class="card kpi"><div class="label">近 7 日新增</div><div class="num" id="kWeek">0<small>人</small></div><div class="note" id="kWeekNote">&nbsp;</div></div>
        <div class="card kpi"><div class="label">距說明會</div><div class="num" id="kDays">0<small>天</small></div><div class="note">115.11.29（日）13:00</div></div>
      </section>

      <section class="grid row2">
        <div class="card">
          <h2>每日報名人數</h2>
          <p class="sub">紅色為今天｜滑過或點選長條看數字</p>
          <div class="chart" id="daily"></div>
        </div>
        <div class="card">
          <h2>學制</h2>
          <p class="sub">人數與占比</p>
          <ul class="hbars" id="byProgram"></ul>
        </div>
      </section>

      <section class="grid row3">
        <div class="card">
          <h2>就讀學校</h2>
          <p class="sub">依人數排序｜國外醫學校合併計算</p>
          <ul class="hbars" id="bySchool"></ul>
        </div>
        <div class="card">
          <h2>得知管道</h2>
          <p class="sub">人數與占比（未填答另計）</p>
          <ul class="hbars" id="bySource"></ul>
        </div>
      </section>

      <section class="card">
        <div class="tbl-head">
          <div><h2>報名名單</h2><span class="count" id="count"></span></div>
          <input type="search" id="q" placeholder="搜尋姓名、學校、E-mail…" aria-label="搜尋報名名單">
        </div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>#</th><th>報名時間</th><th>姓名</th><th>E-mail</th><th>就讀學校</th><th>學制</th><th>得知管道</th><th>推薦人</th><th>想進一步了解</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

<script>
(function () {
  'use strict';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzPsGT_RZx5qVH4miexVhbPE8MDkn8atbIsWqJs8sDxiihiHGeOj32VxEzeo6YRsof7/exec';
  var EVENT_START = new Date('2026-11-29T13:00:00+08:00');
  var KEY_STORE = 'pgy116-dash-key';
  var SCHOOLS = ['國立臺灣大學', '國立陽明交通大學', '國立成功大學', '臺北醫學大學', '長庚大學', '中國醫藥大學', '高雄醫學大學', '中山醫學大學', '輔仁大學', '慈濟大學', '馬偕醫學院', '國防醫學院', '國立清華大學', '國立中興大學', '國立中山大學', '國外醫學校'];
  var PROGRAMS = ['七年制醫學系', '六年制醫學系', '中西醫雙主修', '學士後醫學系'];
  var SOURCES = ['學校公告', '同學推薦', '學長姐推薦', '奇美醫院官方網站／社群', '其他'];

  var $ = function (id) { return document.getElementById(id); };
  var rows = [];
  var dayFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' });
  var timeFmt = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
  function dayKey(d) { return dayFmt.format(d); }               // YYYY-MM-DD (Taipei)
  function store(k, v) { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

  /* ---------- data ---------- */
  function fetchRows(key) {
    var body = new URLSearchParams({ action: 'list', key: key });
    return fetch(GAS_URL, { method: 'POST', body: body })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) throw new Error((res && res.error) || '讀取失敗');
        return res;
      });
  }

  function setLoading(btn, on) { btn.disabled = on; btn.classList.toggle('loading', on); }

  function refresh() {
    var key = load(KEY_STORE);
    if (!key) return showLogin();
    setLoading($('refresh'), true);
    return fetchRows(key).then(function (res) {
      rows = res.rows.map(function (r) { r.date = new Date(r.time); return r; })
        .filter(function (r) { return !isNaN(r.date); })
        .sort(function (a, b) { return b.date - a.date; });
      $('updated').textContent = '更新於 ' + timeFmt.format(new Date());
      render();
    }).catch(function (err) {
      if (/密碼/.test(err.message)) { store(KEY_STORE, null); showLogin(err.message); }
      else $('updated').textContent = '更新失敗：' + (err.message === 'Failed to fetch' ? '網路連線異常' : err.message);
    }).then(function () { setLoading($('refresh'), false); });
  }

  /* ---------- views ---------- */
  function showLogin(msg) {
    $('dash').hidden = true; $('actions').hidden = true; $('login').hidden = false;
    $('loginErr').textContent = msg || '';
    $('pw').value = ''; $('pw').focus();
  }
  function showDash() { $('login').hidden = true; $('dash').hidden = false; $('actions').hidden = false; }

  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var key = $('pw').value.trim();
    if (!key) return;
    setLoading($('loginBtn'), true);
    $('loginErr').textContent = '';
    fetchRows(key).then(function () {
      store(KEY_STORE, key);
      showDash();
      return refresh();
    }).catch(function (err) {
      $('loginErr').textContent = err.message === 'Failed to fetch' ? '網路連線異常，請稍後再試' : err.message;
    }).then(function () { setLoading($('loginBtn'), false); });
  });
  $('refresh').addEventListener('click', refresh);
  $('logout').addEventListener('click', function () { store(KEY_STORE, null); rows = []; showLogin(); });

  /* ---------- render ---------- */
  function setNum(id, n, unit) {
    var el = $(id); el.textContent = n;
    var s = document.createElement('small'); s.textContent = unit; el.appendChild(s);
  }

  function render() {
    var now = new Date();
    var today = dayKey(now);
    var weekAgo = new Date(now.getTime() - 6 * 864e5); weekAgo = dayKey(weekAgo);
    var nToday = rows.filter(function (r) { return dayKey(r.date) === today; }).length;
    var nWeek = rows.filter(function (r) { return dayKey(r.date) >= weekAgo; }).length;
    setNum('kTotal', rows.length, '人');
    setNum('kToday', nToday, '人');
    setNum('kWeek', nWeek, '人');
    var days = Math.max(0, Math.ceil((EVENT_START - now) / 864e5));
    setNum('kDays', days, '天');
    $('kTotalNote').textContent = rows.length ? '最新：' + timeFmt.format(rows[0].date) : '尚無報名';
    var yest = dayKey(new Date(now.getTime() - 864e5));
    var nYest = rows.filter(function (r) { return dayKey(r.date) === yest; }).length;
    $('kTodayNote').textContent = '昨日 ' + nYest + ' 人';
    $('kWeekNote').textContent = '日均 ' + (nWeek / 7).toFixed(1) + ' 人';

    renderDaily(today);
    renderBars('byProgram', PROGRAMS, function (r) { return r.program; }, false);
    renderBars('bySchool', SCHOOLS, function (r) { return /^國外醫學校/.test(r.school) ? '國外醫學校' : r.school; }, true);
    renderBars('bySource', SOURCES, function (r) { return /^其他/.test(r.source) ? '其他' : (r.source || '（未填答）'); }, false, '（未填答）');
    renderTable();
  }

  function renderBars(id, cats, pick, sortByCount, extra) {
    var counts = {}; cats.forEach(function (c) { counts[c] = 0; });
    if (extra) counts[extra] = 0;
    rows.forEach(function (r) { var k = pick(r); if (k in counts) counts[k]++; else counts[k] = (counts[k] || 0) + 1; });
    var list = Object.keys(counts).map(function (k) { return { k: k, n: counts[k] }; });
    if (extra && !counts[extra]) list = list.filter(function (x) { return x.k !== extra; });
    if (sortByCount) list.sort(function (a, b) { return b.n - a.n; });
    var max = Math.max.apply(null, list.map(function (x) { return x.n; }).concat(1));
    var total = rows.length || 1;
    var ul = $(id); ul.textContent = '';
    list.forEach(function (x) {
      var li = document.createElement('li'); li.className = 'hbar' + (x.n ? '' : ' zero');
      var pct = Math.round(x.n / total * 100);
      li.title = x.k + '：' + x.n + ' 人（' + pct + '%）';
      var name = document.createElement('span'); name.className = 'name'; name.textContent = x.k;
      var track = document.createElement('span'); track.className = 'track';
      var fill = document.createElement('span'); fill.className = 'fill'; fill.style.width = (x.n ? x.n / max * 100 : 0) + '%';
      track.appendChild(fill);
      var val = document.createElement('span'); val.className = 'val'; val.textContent = x.n;
      var sm = document.createElement('small'); sm.textContent = rows.length ? pct + '%' : ''; val.appendChild(sm);
      li.appendChild(name); li.appendChild(track); li.appendChild(val);
      ul.appendChild(li);
    });
  }

  function renderDaily(today) {
    var box = $('daily'); box.textContent = '';
    if (!rows.length) { var e = document.createElement('p'); e.className = 'empty'; e.textContent = '目前還沒有報名資料'; box.appendChild(e); return; }
    var counts = {};
    rows.forEach(function (r) { var k = dayKey(r.date); counts[k] = (counts[k] || 0) + 1; });
    // continuous days from first registration to today (max 60 bars)
    var keys = Object.keys(counts).sort();
    var start = new Date(keys[0] + 'T12:00:00+08:00');
    var end = new Date(today + 'T12:00:00+08:00');
    var days = [];
    for (var d = new Date(start); d <= end; d = new Date(d.getTime() + 864e5)) days.push(dayKey(d));
    if (days.length > 60) days = days.slice(-60);
    var data = days.map(function (k) { return { k: k, n: counts[k] || 0 }; });

    var W = Math.max(box.clientWidth, 280), H = 240, padL = 28, padR = 6, padT = 12, padB = 26;
    var max = Math.max.apply(null, data.map(function (x) { return x.n; }).concat(1));
    var step = max <= 5 ? 1 : Math.ceil(max / 4);
    var top = Math.ceil(max / step) * step;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var slot = plotW / data.length, bw = Math.max(2, Math.min(36, slot - 2));
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', '每日報名人數長條圖，共 ' + data.length + ' 天，最多單日 ' + max + ' 人');
    function el(tag, attrs, text) { var n = document.createElementNS(NS, tag); for (var a in attrs) n.setAttribute(a, attrs[a]); if (text != null) n.textContent = text; svg.appendChild(n); return n; }
    for (var v = 0; v <= top; v += step) {
      var y = padT + plotH - v / top * plotH;
      if (v > 0) el('line', { x1: padL, x2: W - padR, y1: y, y2: y, 'class': 'gridline' });
      el('text', { x: padL - 6, y: y + 4, 'text-anchor': 'end', 'class': 'axis' }, v);
    }
    el('line', { x1: padL, x2: W - padR, y1: padT + plotH, y2: padT + plotH, 'class': 'baseline' });
    var labelEvery = Math.ceil(data.length / Math.floor(plotW / 44));
    var tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; box.appendChild(tip);
    data.forEach(function (x, i) {
      var cx = padL + slot * i + slot / 2;
      var h = x.n / top * plotH;
      var hit = el('rect', { x: padL + slot * i, y: padT, width: slot, height: plotH, 'class': 'hit' });
      var bar = null;
      if (x.n) {
        var r = Math.min(4, bw / 2, h);
        var bx = cx - bw / 2, by = padT + plotH - h;
        bar = el('path', { d: 'M' + bx + ',' + (padT + plotH) + 'V' + (by + r) + 'Q' + bx + ',' + by + ' ' + (bx + r) + ',' + by + 'H' + (bx + bw - r) + 'Q' + (bx + bw) + ',' + by + ' ' + (bx + bw) + ',' + (by + r) + 'V' + (padT + plotH) + 'Z', 'class': 'bar' + (x.k === today ? ' today' : '') });
      }
      if (i % labelEvery === 0 || i === data.length - 1) {
        el('text', { x: cx, y: H - 8, 'text-anchor': 'middle', 'class': 'axis' }, x.k.slice(5).replace('-', '/'));
      }
      function show() {
        tip.textContent = '';
        var b = document.createElement('b'); b.textContent = x.n; tip.appendChild(b);
        tip.appendChild(document.createTextNode(' 人｜' + x.k.slice(5).replace('-', '/') + (x.k === today ? '（今天）' : '')));
        tip.style.left = (cx / W * 100) + '%';
        tip.style.top = ((padT + plotH - h) / H * 240) + 'px';
        tip.hidden = false;
        if (bar) bar.classList.add('hover');
      }
      function hide() { tip.hidden = true; if (bar) bar.classList.remove('hover'); }
      hit.addEventListener('mouseenter', show); hit.addEventListener('mouseleave', hide);
      hit.addEventListener('click', show);
    });
    box.insertBefore(svg, tip);
  }

  function renderTable() {
    var q = $('q').value.trim().toLowerCase();
    var list = rows.filter(function (r) {
      if (!q) return true;
      return [r.name, r.email, r.school, r.program, r.source, r.referrer, r.interest].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    $('count').textContent = q ? '符合 ' + list.length + ' / ' + rows.length + ' 筆' : '共 ' + rows.length + ' 筆（新到舊）';
    var tb = $('tbody'); tb.textContent = '';
    if (!list.length) {
      var tr0 = document.createElement('tr'), td0 = document.createElement('td');
      td0.colSpan = 9; td0.className = 'empty'; td0.textContent = rows.length ? '找不到符合的資料' : '目前還沒有報名資料';
      tr0.appendChild(td0); tb.appendChild(tr0); return;
    }
    list.forEach(function (r) {
      var tr = document.createElement('tr');
      var idx = rows.length - rows.indexOf(r);
      [[idx, 'num'], [timeFmt.format(r.date), 'time'], [r.name, 'nw'], [r.email, 'mail'], [r.school], [r.program, 'nw'], [r.source], [r.referrer, 'nw'], [r.interest, 'long']]
        .forEach(function (c) { var td = document.createElement('td'); td.textContent = c[0] == null ? '' : c[0]; if (c[1]) td.className = c[1]; tr.appendChild(td); });
      tb.appendChild(tr);
    });
  }
  $('q').addEventListener('input', renderTable);

  /* ---------- Excel (.xlsx) ---------- */
  // 不依賴外部套件：自行組出 xlsx（Office Open XML + 未壓縮 zip）
  var CRC_T = (function () { var t = [], c; for (var n = 0; n < 256; n++) { c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { var c = 0xFFFFFFFF; for (var i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(files) {
    var enc = new TextEncoder(), parts = [], central = [], offset = 0;
    files.forEach(function (f) {
      var name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    });
    var cdSize = central.reduce(function (n, u) { return n + u.length; }, 0);
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [new Uint8Array(e.buffer)]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  function xmlEsc(v) {
    return String(v == null ? '' : v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function colName(i) { var s = ''; i++; while (i) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  function buildXlsx(head, data, widths) {
    function row(cells, r, style) {
      return '<row r="' + r + '">' + cells.map(function (v, i) {
        var ref = colName(i) + r;
        if (typeof v === 'number') return '<c r="' + ref + '"' + (style ? ' s="' + style + '"' : '') + '><v>' + v + '</v></c>';
        return '<c r="' + ref + '" t="inlineStr"' + (style ? ' s="' + style + '"' : ' s="2"') + '><is><t xml:space="preserve">' + xmlEsc(v) + '</t></is></c>';
      }).join('') + '</row>';
    }
    var last = colName(head.length - 1) + (data.length + 1);
    var sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      '<cols>' + widths.map(function (w, i) { return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>'; }).join('') + '</cols>' +
      '<sheetData>' + row(head, 1, 1) + data.map(function (d, i) { return row(d, i + 2); }).join('') + '</sheetData>' +
      '<autoFilter ref="A1:' + last + '"/></worksheet>';
    var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="2"><font><sz val="11"/><name val="Microsoft JhengHei"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Microsoft JhengHei"/></font></fonts>' +
      '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF213C8F"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"><alignment vertical="center"/></xf>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
    return zip([
      { name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
      { name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
      { name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="報名名單" sheetId="1" r:id="rId1"/></sheets></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
      { name: 'xl/worksheets/sheet1.xml', data: sheet },
      { name: 'xl/styles.xml', data: styles }
    ]);
  }

  $('xlsx').addEventListener('click', function () {
    var head = ['序號', '報名時間', '姓名', '電子郵件', '就讀學校', '學制', '得知管道', '推薦人姓名', '想進一步了解的部分'];
    var fullFmt = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    var data = rows.slice().reverse().map(function (r, i) {
      return [i + 1, fullFmt.format(r.date), r.name, r.email, r.school, r.program, r.source, r.referrer, r.interest];
    });
    var blob = buildXlsx(head, data, [7, 21, 12, 30, 24, 15, 24, 12, 50]);
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'PGY116_registrations_' + dayKey(new Date()) + '.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  /* ---------- resize & auto refresh ---------- */
  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (rows.length) renderDaily(dayKey(new Date())); }, 150); });
  setInterval(function () { if (!document.hidden && !$('dash').hidden) refresh(); }, 60000);

  /* ---------- start ---------- */
  if (load(KEY_STORE)) { showDash(); refresh(); } else showLogin();
})();
</script>
