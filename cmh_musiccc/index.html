<head>

<title>下一站，奇美！</title>
<meta name="description" content="奇美醫院 PGY 主題曲《下一站，奇美！》歌詞播放">

<style>
:root{
  --navy:#213C8F; --navy-d:#172B6A; --orange:#FFA319; --red:#F2541B; --yellow:#FFC83D;
  --ink:#161616; --muted:#8A93AE; --band:#FFF6E2; --pulse:0;
  --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-en:"Poppins",var(--font);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);background:#fff;-webkit-tap-highlight-color:transparent;user-select:none}
body.idle{cursor:none}
svg{display:block}

/* ---------- 背景裝飾 ---------- */
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(33,60,143,.12) 1.5px,transparent 0) 0 0/26px 26px}
.deco{position:absolute;width:min(30vw,48vh)}
.deco .blob{transform-box:fill-box;transform-origin:center;animation:morph 8s ease-in-out infinite}
.b-navy{fill:var(--navy)} .b-orange{fill:var(--orange)} .b-red{fill:var(--red)}
.deco .dots circle{fill:#fff}
.deco .lines{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round}
.deco .arc-y{fill:none;stroke:var(--yellow);stroke-width:12;stroke-linecap:round}
.deco .squiggle{fill:none;stroke:var(--navy);stroke-width:6;stroke-linecap:round;animation:sway 6s ease-in-out infinite}
.d-tl{top:-6vh;left:-6vw;transform:scale(calc(1 + var(--pulse)*.06))}
.d-tr{top:-8vh;right:-5vw;width:min(34vw,54vh);transform:scale(calc(1 + var(--pulse)*.05))}
.d-bl{bottom:-10vh;left:-7vw;transform:scale(calc(1 + var(--pulse)*.05))}
.d-br{bottom:-9vh;right:-6vw;transform:scale(calc(1 + var(--pulse)*.06))}
.d-tl,.d-tr,.d-bl,.d-br{transition:transform .12s ease-out}
.d-br .squiggle{stroke:var(--red)}
.fl{position:absolute;width:clamp(28px,3.4vw,52px);height:clamp(28px,3.4vw,52px);color:var(--navy);animation:bob 5s ease-in-out infinite}
.fl.star-y{color:var(--yellow)} .fl.star-o{color:var(--orange)} .fl.flower-r{color:var(--red)}
.f1{top:16%;left:4%;animation-delay:-1s}.f2{top:58%;left:3%;animation-delay:-2.5s}
.f3{top:30%;right:4%;animation-delay:-.5s}.f4{top:72%;right:5%;animation-delay:-3s}
.f5{top:8%;left:34%;animation-delay:-1.8s}.f6{bottom:22%;left:9%;animation-delay:-4s}
.f7{top:10%;right:30%;animation-delay:-2s}.f8{bottom:26%;right:10%;animation-delay:-3.6s}

/* ---------- 版面 ---------- */
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.2vh,26px);padding:clamp(12px,2.5vh,28px) 16px}
.top{position:absolute;top:clamp(10px,2vh,22px);left:clamp(12px,2vw,28px);right:clamp(12px,2vw,28px);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:3}
.brand{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:999px;padding:4px 16px 4px 6px;font-weight:900;color:var(--navy);font-size:clamp(.8rem,1.2vw,1.05rem)}
.brand img{height:clamp(28px,4vh,40px);width:auto;margin-left:6px}
.song-tag{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:999px;padding:6px 16px;font-weight:900;font-size:clamp(.8rem,1.2vw,1.05rem);transform:rotate(2deg)}
.song-tag .note{color:var(--yellow);font-size:1.2em;animation:hop 1.2s ease-in-out infinite}

/* 16:9 照片框 */
.frame-wrap{position:relative;width:min(88vw,calc((100vh - clamp(200px,32vh,360px)) * 16 / 9));margin-top:clamp(34px,5.5vh,60px)}
.frame-wrap::before{content:"";position:absolute;inset:clamp(-12px,-1vw,-8px);border-radius:clamp(22px,2.2vw,34px);border:clamp(3px,.3vw,5px) dashed var(--orange);animation:noticeRing 2.4s ease-in-out infinite;pointer-events:none}
.notice{position:absolute;z-index:3;top:clamp(-26px,-2.4vh,-18px);left:50%;transform:translateX(-50%) rotate(-2deg);display:flex;align-items:center;gap:.5em;white-space:nowrap;
  background:var(--red);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:999px;padding:4px 20px 4px 12px;font-weight:900;font-size:clamp(.9rem,1.5vw,1.35rem);animation:noticeBob 1.6s ease-in-out infinite}
.notice .ic{display:grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);font-size:.9em}
.notice small{font-family:var(--font-en);font-weight:800;color:var(--yellow);font-size:.75em;letter-spacing:.08em}
.frame{position:relative;aspect-ratio:16/9;border:clamp(3px,.35vw,5px) solid var(--ink);border-radius:clamp(14px,1.6vw,26px);overflow:hidden;background:var(--band);
  box-shadow:clamp(6px,.7vw,12px) clamp(6px,.7vw,12px) 0 var(--ink);transform:rotate(-.6deg)}
.frame .slot{position:absolute;inset:0;opacity:0;transition:opacity .8s ease}
.frame .slot.on{opacity:1}
.frame .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .slot img.bad{display:none}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--navy);font-weight:900;text-align:center;
  background:repeating-linear-gradient(45deg,#FFF6E2 0 22px,#FFEFCC 22px 44px)}
.empty b{font-family:var(--font-en);font-size:clamp(1.6rem,4vw,3.4rem);background:var(--navy);color:#fff;padding:0 .3em;border-radius:.2em;transform:rotate(-4deg)}
.empty span{font-size:clamp(.85rem,1.4vw,1.2rem);color:var(--muted)}
.frame.drag{outline:6px dashed var(--orange);outline-offset:-14px}
.chimei-badge{position:absolute;z-index:2;right:clamp(-16px,-1vw,-10px);bottom:clamp(-18px,-1.8vh,-12px);background:var(--red);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:999px;
  padding:4px 16px;font-family:var(--font-en);font-weight:900;letter-spacing:.06em;font-size:clamp(.8rem,1.3vw,1.15rem);transform:rotate(-6deg) scale(calc(1 + var(--pulse)*.12));transition:transform .12s}

/* 歌詞 */
.lyrics{position:relative;width:min(94vw,1500px);height:clamp(100px,19vh,220px);text-align:center}
.line{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1vh,12px);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.9,.3,1.2)}
.line.out{opacity:0;transform:translateY(-28px) scale(.96)}
.line.pre{opacity:0;transform:translateY(30px) scale(.96);transition:none}
.cur{font-weight:900;line-height:1.3;letter-spacing:.06em;font-size:min(3.6vw,5.6vh);color:#C5CCE2;max-width:100%}
.cur .c{transition:color .18s ease,text-shadow .18s ease;display:inline-block}
.cur .c.on{color:var(--navy);text-shadow:.05em .05em 0 var(--yellow)}
.cur .c.hl{color:#F7B9A2}
.cur .c.hl.on{color:var(--red);text-shadow:.05em .05em 0 var(--yellow)}
.cur .sp{display:inline-block;width:.6em}
.cur.big{font-size:min(4.6vw,7.4vh)}
.nxt{font-weight:700;letter-spacing:.06em;color:var(--muted);font-size:min(1.7vw,2.7vh)}
.nxt::before{content:"▸ ";color:var(--orange)}
.nxt:empty::before{content:""}
.title-card .cur{color:var(--navy);text-shadow:.05em .05em 0 var(--yellow)}
.title-card .cur em{font-style:normal;color:var(--red)}
.inst{font-family:var(--font-en);font-weight:900;color:var(--orange);font-size:min(3.4vw,5.5vh);letter-spacing:.3em}
.inst span{display:inline-block;animation:hop 1s ease-in-out infinite}
.inst span:nth-child(2){animation-delay:.15s}.inst span:nth-child(3){animation-delay:.3s}


/* 控制列 */
.ctrl{position:fixed;left:50%;bottom:clamp(10px,2vh,20px);transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  border-radius:999px;padding:6px 10px;width:min(720px,94vw);transition:opacity .4s,transform .4s}
body.idle .ctrl{opacity:0;transform:translate(-50%,20px);pointer-events:none}
.picker{position:fixed;left:clamp(10px,1.6vw,22px);bottom:clamp(10px,2vh,20px);z-index:11;display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  border-radius:999px;padding:5px 6px 5px 14px;font-weight:900;color:var(--navy);font-size:.9rem;transition:opacity .4s,transform .4s}
body.idle .picker{opacity:0;transform:translateY(20px);pointer-events:none}
.picker button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--navy);font-family:var(--font-en);font-weight:900;font-size:1rem;cursor:pointer}
.picker button:hover{background:var(--band)}
.picker button.on{background:var(--red);color:#fff}
@media (max-width:820px){ .picker{bottom:78px} }
.ctrl button{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer}
.ctrl button:hover{background:var(--red)}
.ctrl button svg{width:18px;height:18px;fill:currentColor}
.ctrl .time{font-family:var(--font-en);font-weight:800;font-size:.8rem;color:var(--navy);min-width:86px;text-align:center}
.bar{flex:1;height:10px;border-radius:99px;background:#E6EAF5;cursor:pointer;position:relative;border:2px solid var(--ink)}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--orange),var(--red));border-radius:99px}
.toast{position:fixed;top:clamp(70px,11vh,110px);left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;font-weight:700;border-radius:999px;padding:8px 18px;font-size:.95rem;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* 對時模式 */
.calib{position:fixed;inset:auto 16px 80px auto;z-index:25;width:min(380px,calc(100vw - 32px));background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:18px;padding:14px 16px;font-size:.9rem}
.calib h3{margin:0 0 6px;color:var(--red);font-size:1rem}
.calib p{margin:4px 0;line-height:1.5}
.calib textarea{width:100%;height:110px;font-family:ui-monospace,monospace;font-size:.75rem;border:2px solid var(--ink);border-radius:8px;padding:6px}
.calib .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.calib .row button{border:2px solid var(--ink);border-radius:999px;background:var(--yellow);font-weight:800;padding:4px 12px;cursor:pointer}

@media (orientation:portrait){
  .frame-wrap{width:92vw;margin-top:clamp(70px,12vh,120px)}
  .lyrics{height:clamp(150px,26vh,260px)}
  .cur{font-size:min(7vw,5vh)} .cur.big{font-size:9vw}
  .nxt{font-size:min(3.8vw,2.6vh)}
  .song-tag{font-size:.78rem}
  .deco{width:46vw}.d-tr{width:52vw}
}
@media (max-width:560px){ .brand span{display:none} .brand{padding:4px 8px 4px 2px} }

@keyframes morph{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.05) rotate(3deg)}}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes noticeRing{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.008)}}
@keyframes noticeBob{0%,100%{transform:translateX(-50%) rotate(-2deg)}50%{transform:translateX(-50%) rotate(-2deg) translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}60%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ==========================================================
   照片設定：三張照片放進 cmh_musiccc/photos/，檔名對應下面三格。
   畫面左下角（或鍵盤 1 / 2 / 3）切換，選了就固定顯示，不會輪播。
   ========================================================== */
const PHOTOS = [
  'photos/1.jpg',
  'photos/2.jpg',
  'photos/3.jpg',
];

/* 歌詞時間軸（秒）。s = 段落名稱（只需寫在該段第一句） */
const LYRICS = [
  {t:0,      inst:'title', s:['前奏','INTRO']},
  {t:8.9,    l:'還記得第一次穿上白袍的模樣', s:['主歌','VERSE 1']},
  {t:12.55,  l:'心裡藏著期待　也有一點徬徨'},
  {t:16.1,   l:'那些熬夜讀書的夜晚'},
  {t:19.35,  l:'那些努力不放棄的時光'},
  {t:23.35,  l:'從教室走向病房的走廊'},
  {t:27.1,   l:'開始學著成為別人的依靠'},
  {t:30.6,   l:'也許前方的路還很長'},
  {t:33.6,   l:'但夢想已經準備好出發'},
  {t:37.35,  l:'每一次跌倒　都是成長的記號', s:['預副歌','PRE-CHORUS']},
  {t:41.35,  l:'每一份堅持　都值得被看見'},
  {t:45.1,   l:'當未來的方向還不夠明朗'},
  {t:48.6,   l:'別害怕　我們陪你一起闖'},
  {t:53.7,   l:'下一站　就選奇美！', s:['副歌','CHORUS'], big:1},

const LEAD = 0.3;          // 歌詞比歌聲提早幾秒出現
const HL = /奇美|CHIMEI/g;  // 強調色字詞

/* ---------- 對時資料（對時模式存的會覆蓋預設） ---------- */
let offset = 0;
try { offset = parseFloat(localStorage.getItem('cmh_offset')) || 0; } catch(e) {}
try {
  const saved = JSON.parse(localStorage.getItem('cmh_times') || 'null');
  const lineIdx = LYRICS.map((x,i)=>x.l ? i : -1).filter(i=>i>=0);
  if (Array.isArray(saved) && saved.length === lineIdx.length) lineIdx.forEach((i,k)=>{ if (typeof saved[k]==='number') LYRICS[i].t = saved[k]; });
} catch(e) {}

const $ = id => document.getElementById(id);
const audio = $('audio'), lyricsEl = $('lyrics');

/* ---------- 照片 ---------- */
const frame = $('frame');
const slots = PHOTOS.map((src,i)=>{
  const d = document.createElement('div'); d.className = 'slot';
  d.innerHTML = `<div class="empty"><b>照片 ${i+1}</b>16:9 照片位置<span>放入 cmh_musiccc/${src}，或把照片拖曳到這裡預覽</span></div>`;
  const im = new Image(); im.alt = `照片 ${i+1}`;
  im.onerror = ()=>im.classList.add('bad'); im.onload = ()=>im.classList.remove('bad');
  im.src = src; d.appendChild(im); frame.appendChild(d);
  return {d, im};
});
let photoIdx = 0;
function selectPhoto(i){
  if (!slots[i]) return;
  photoIdx = i;
  slots.forEach((s,k)=>s.d.classList.toggle('on', k === i));
  document.querySelectorAll('#picker button').forEach((b,k)=>b.classList.toggle('on', k === i));
}
selectPhoto(0);
$('picker').addEventListener('click', e=>{ const b = e.target.closest('button'); if (b) selectPhoto(+b.dataset.i); });
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); frame.classList.add('drag'); }));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); frame.classList.remove('drag'); }));
document.addEventListener('drop', e=>{
  const files = [...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));
  if (!files.length) return;
  if (files.length === 1) slots[photoIdx].im.src = URL.createObjectURL(files[0]);
  else files.slice(0, slots.length).forEach((f,k)=>slots[k].im.src = URL.createObjectURL(f));
  toast(files.length === 1 ? `照片 ${photoIdx+1} 預覽中（重新整理後會恢復）` : `已預覽 ${Math.min(files.length, slots.length)} 張照片（依序放入 1、2、3）`);
});

/* ---------- 歌詞渲染 ---------- */
const esc = s => s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function nextLine(i){ for (let k=i+1;k<LYRICS.length;k++) if (LYRICS[k].l) return LYRICS[k]; return null; }

function buildLine(i){
  const it = LYRICS[i], wrap = document.createElement('div');
  wrap.className = 'line pre';
  if (it.inst === 'title') {
    wrap.classList.add('title-card');
    wrap.innerHTML = `<div class="cur big">下一站，<em>奇美</em>！</div><div class="nxt">${esc(nextLine(i)?.l || '')}</div>`;
  } else if (it.inst) {
    const nx = nextLine(i);
    wrap.innerHTML = `<div class="inst"><span>♪</span><span>♫</span><span>♪</span></div><div class="nxt">${esc(nx?.l || '')}</div>`;
  } else {
    const hl = new Set(); let m; HL.lastIndex = 0;
    while ((m = HL.exec(it.l))) for (let k=m.index;k<m.index+m[0].length;k++) hl.add(k);
    const chars = [...it.l].map((ch,k)=> /[\s　]/.test(ch) ? '<span class="sp"></span>' : `<span class="c${hl.has(k)?' hl':''}">${esc(ch)}</span>`).join('');
    const nx = nextLine(i);
    wrap.innerHTML = `<div class="cur${it.big?' big':''}">${chars}</div><div class="nxt">${esc(nx?.l || '')}</div>`;
    // 逐字點亮的時間
    const n = [...it.l].filter(ch=>!/[\s　！!，。、]/.test(ch)).length;
    const after = LYRICS[i+1] ? LYRICS[i+1].t - it.t - 0.25 : 4;
    wrap._dur = Math.max(0.6, Math.min(after, n * 0.33));
    wrap._chars = [...wrap.querySelectorAll('.c')];
  }
  wrap._i = i;
  return wrap;
}

let curIdx = -1, curEl = null;
function show(i){
  if (i === curIdx) return;
  curIdx = i;
  const old = curEl;
  if (old) { old.classList.add('out'); setTimeout(()=>old.remove(), 600); }
  curEl = buildLine(i);
  lyricsEl.appendChild(curEl);
  requestAnimationFrame(()=>requestAnimationFrame(()=>curEl && curEl.classList.remove('pre')));
}
function indexAt(t){
  let idx = 0;
  for (let k=0;k<LYRICS.length;k++) if (t + LEAD - offset >= LYRICS[k].t) idx = k; else break;
  return idx;
}

/* ---------- 音樂律動（僅在網站上啟用，避免本機開檔時靜音） ---------- */
let analyser = null, freq = null;
function setupAnalyser(){
  if (analyser || !/^https?:/.test(location.protocol)) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaElementSource(audio);
    analyser = ctx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = .7;
    src.connect(analyser); analyser.connect(ctx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
    audio.addEventListener('play', ()=>ctx.resume());
  } catch(e) { analyser = null; }
}

/* ---------- 主迴圈 ---------- */
const fmt = s => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '0:00';
function tick(){
  const t = audio.currentTime;
  show(indexAt(t));
  if (curEl && curEl._chars) {
    const it = LYRICS[curEl._i];
    const p = (t + 0.05 - offset - it.t) / curEl._dur;
    const n = curEl._chars.length;
    curEl._chars.forEach((c,k)=>c.classList.toggle('on', p * n > k));
  }
  $('barFill').style.width = (audio.duration ? t / audio.duration * 100 : 0) + '%';
  $('time').textContent = `${fmt(t)} / ${fmt(audio.duration)}`;
  if (analyser && !audio.paused) {
    analyser.getByteFrequencyData(freq);
    let b = 0; for (let k=1;k<8;k++) b += freq[k]; b = b / 7 / 255;
    document.documentElement.style.setProperty('--pulse', Math.max(0, (b - .45) * 2.2).toFixed(3));
  }
  requestAnimationFrame(tick);
}
show(0);
requestAnimationFrame(tick);

/* ---------- 控制 ---------- */
function toast(msg){ const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 1800); }
function setIcon(){ $('icoPlay').innerHTML = audio.paused ? '<path d="M7 4l13 8-13 8z"/>' : '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>'; }
audio.addEventListener('play', setIcon); audio.addEventListener('pause', setIcon);
function togglePlay(){ if (audio.paused) { setupAnalyser(); audio.play(); } else audio.pause(); }
function toggleFs(){
  const d = document, el = d.documentElement;
  if (!d.fullscreenElement && !d.webkitFullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || (()=>{})).call(el);
  else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
}
$('btnPlay').addEventListener('click', togglePlay);
$('btnFs').addEventListener('click', toggleFs);
$('bar').addEventListener('click', e=>{ const r = e.currentTarget.getBoundingClientRect(); if (audio.duration) audio.currentTime = (e.clientX - r.left) / r.width * audio.duration; });

let idleT;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(()=>{ if (!audio.paused) document.body.classList.add('idle'); }, 2500); }
['mousemove','touchstart','keydown'].forEach(ev=>document.addEventListener(ev, wake, {passive:true}));
audio.addEventListener('pause', wake); wake();

/* ---------- 對時模式（按 T）：邊聽邊在每句開始時按 Enter ---------- */
let calib = null;
function lineIdxs(){ return LYRICS.map((x,i)=>x.l ? i : -1).filter(i=>i>=0); }
function startCalib(){
  calib = { idxs: lineIdxs(), k: 0, times: [] };
  const box = document.createElement('div'); box.className = 'calib'; box.id = 'calib';
  box.innerHTML = `<h3>● 對時模式</h3><p>音樂從頭播放，每句歌詞<b>開口唱的瞬間</b>按 <b>Enter</b>（或點這個框）。</p><p id="calibNow"></p>
    <div class="row"><button id="calibStop">結束並儲存</button><button id="calibCancel">取消</button></div>`;
  document.body.appendChild(box);
  box.addEventListener('click', e=>{ if (e.target.tagName !== 'BUTTON') mark(); });
  $('calibStop').onclick = finishCalib; $('calibCancel').onclick = ()=>{ box.remove(); calib = null; };
  audio.currentTime = 0; setupAnalyser(); audio.play();
  updCalib();
}
function updCalib(){ const n = $('calibNow'); if (!n || !calib) return; const i = calib.idxs[calib.k]; n.innerHTML = i !== undefined ? `下一句（${calib.k+1}/${calib.idxs.length}）：<b>${esc(LYRICS[i].l)}</b>` : '全部完成！'; }
function mark(){ if (!calib || calib.k >= calib.idxs.length) return; calib.times.push(+audio.currentTime.toFixed(2)); calib.k++; updCalib(); if (calib.k >= calib.idxs.length) finishCalib(); }
function finishCalib(){
  if (!calib) return;
  const all = calib.idxs.map((i,k)=> calib.times[k] ?? LYRICS[i].t);
  calib.idxs.forEach((i,k)=>LYRICS[i].t = all[k]);
  try { localStorage.setItem('cmh_times', JSON.stringify(all)); } catch(e) {}
  const box = $('calib');
  box.innerHTML = `<h3>✔ 已儲存在這台電腦的瀏覽器</h3><p>想永久套用到網站，把下面這串傳給 Claude：</p><textarea readonly>${JSON.stringify(all)}</textarea>
    <div class="row"><button id="calibCopy">複製</button><button id="calibClose">關閉</button></div>`;
  $('calibCopy').onclick = ()=>{ box.querySelector('textarea').select(); navigator.clipboard?.writeText(JSON.stringify(all)); toast('已複製'); };
  $('calibClose').onclick = ()=>box.remove();
  calib = null; curIdx = -1;
}

document.addEventListener('keydown', e=>{
  if (e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if (calib && (k === 'Enter' || k === 'ArrowDown')) { e.preventDefault(); mark(); return; }
  if (k === ' ' || k === 'k') { e.preventDefault(); togglePlay(); }
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === '1' || k === '2' || k === '3') selectPhoto(+k - 1);
  else if (k === 'ArrowRight') audio.currentTime = Math.min((audio.duration||0) - .1, audio.currentTime + 5);
  else if (k === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
  else if (k === '[' || k === ']') {
    offset = +(offset + (k === ']' ? .1 : -.1)).toFixed(1);
    try { localStorage.setItem('cmh_offset', offset); } catch(e) {}
    toast(`歌詞整體${offset >= 0 ? '延後' : '提前'} ${Math.abs(offset).toFixed(1)} 秒`);
  }
  else if (k === 't' || k === 'T') { if (!calib) { startCalib(); } }
  else if (k === 'r' || k === 'R') {
    if (confirm('清除這台電腦上的對時紀錄，恢復預設時間？')) { try { localStorage.removeItem('cmh_times'); localStorage.removeItem('cmh_offset'); } catch(e) {} location.reload(); }
  }
});
