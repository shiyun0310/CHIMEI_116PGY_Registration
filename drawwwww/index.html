<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFF6E5">
  <title>抽獎｜奇美醫院PGY醫師招募說明會</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23FFA319'/%3E%3Cpath d='M4 32h56' stroke='%23161616' stroke-width='5'/%3E%3Cpath d='M4 32a28 28 0 0 0 56 0z' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23161616' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --navy: #213C8F; --orange: #FFA319; --red: #F2541B; --yellow: #FFC83D; --green: #1E9E5A;
      --ink: #161616; --ink-2: #3A4050; --muted: #6B7180; --line: #EADFCB;
      --bg: #FFF6E5; --card: #FFFFFF; --soft: #FFF9EE;
      --font: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      --font-en: "Poppins", var(--font);
    }
    * { box-sizing: border-box; }
    /* 整體字級隨螢幕寬度放大，投影時字夠大 */
    html { -webkit-text-size-adjust: 100%; font-size: clamp(16px, 1.3vw, 30px); }
    body {
      margin: 0; font-family: var(--font); color: var(--ink); line-height: 1.5; min-height: 100vh; overflow-x: hidden;
      background:
        radial-gradient(40vw 40vw at 0% 100%, rgba(255,163,25,.16), transparent 70%),
        radial-gradient(36vw 36vw at 100% 0%, rgba(242,84,27,.10), transparent 70%),
        var(--bg);
    }
    [hidden] { display: none !important; }
    button, input { font: inherit; }

    /* ---------- header ---------- */
    .top { display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; padding: .7rem clamp(16px, 2vw, 2rem) .2rem; }
    .top h1 { margin: 0; font-size: 1.6rem; font-weight: 900; line-height: 1.25; }
    .top h1 small { display: block; font-family: var(--font-en); font-size: .5em; font-weight: 800; letter-spacing: .25em; color: var(--red); }
    .tools { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
    .chip { font-size: .7rem; color: var(--muted); }
    .tbtn {
      min-height: 36px; padding: .2rem .8rem; border-radius: 999px; border: 2px solid var(--ink); background: #fff;
      color: var(--ink); font-weight: 700; font-size: .7rem; cursor: pointer;
    }
    .tbtn:hover { background: var(--yellow); }
    .tbtn:focus-visible, .go:focus-visible, input:focus-visible, .rbtn:focus-visible, .pbtn:focus-visible { outline: 3px dashed var(--red); outline-offset: 3px; }
    .tbtn[disabled] { opacity: .5; cursor: progress; }
    .tbtn[aria-pressed="false"] { opacity: .55; }
    .chip.hint { color: var(--red); font-weight: 700; animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .35; } }

    /* ---------- login ---------- */
    .login { max-width: 460px; margin: 10vh auto 0; padding: 0 16px; }
    .login form { background: #fff; border: 3px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--orange); padding: 26px 22px; }
    .login h2 { margin: 0 0 16px; font-weight: 900; }
    .login p { margin: 0 0 16px; color: var(--ink-2); font-size: .9rem; }
    .login input { width: 100%; min-height: 50px; padding: 10px 14px; font-size: 18px; border: 2px solid var(--ink); border-radius: 14px; background: var(--soft); margin-bottom: 14px; }
    .login button { width: 100%; min-height: 50px; border-radius: 999px; border: 2px solid var(--ink); background: var(--red); color: #fff; font-weight: 900; font-size: 1.05rem; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
    .login button[disabled] { opacity: .6; cursor: progress; }
    .login .err { color: var(--red); font-weight: 700; min-height: 1.4em; margin: 10px 0 0; }

    /* ---------- stage：左 數字｜中 抽獎機｜右 規則與獎品 ---------- */
    .stage {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1fr); gap: clamp(16px, 2vw, 2.4rem);
      padding: .6rem clamp(16px, 2vw, 2rem) 1.2rem; align-items: start;
    }
    .col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
    .center { align-items: center; gap: .5rem; }
    .panel { background: var(--card); border: 3px solid var(--ink); border-radius: 1.1rem; box-shadow: 6px 6px 0 var(--orange); padding: 1rem 1.2rem; }
    .panel h2 { margin: 0 0 .5rem; font-size: 1.35rem; font-weight: 900; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .panel h2 .tbtn { min-height: 32px; font-size: .65rem; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .stat { text-align: center; padding: .7rem .5rem .8rem; }
    .stat .lbl { font-size: 1rem; font-weight: 900; color: var(--ink-2); line-height: 1.3; }
    .stat .num { font-family: var(--font-en); font-weight: 800; font-size: 3.6rem; line-height: 1.1; color: var(--red); }
    .stat .num small { font-family: var(--font); font-size: .3em; font-weight: 900; color: var(--ink); margin-left: .15em; }
    .stat.alt { box-shadow: 6px 6px 0 var(--yellow); }
    .stat.alt .num { color: var(--navy); }
    .substat { margin: 0; text-align: center; font-size: 1rem; font-weight: 700; color: var(--ink-2); }
    .substat b { color: var(--red); font-family: var(--font-en); }

    .rules { margin: 0; padding: 0; list-style: none; display: grid; gap: .45rem; }
    .rules li { position: relative; padding-left: 1.1em; font-size: 1.25rem; font-weight: 700; line-height: 1.4; }
    .rules li::before { content: ""; position: absolute; left: 0; top: .55em; width: .45em; height: .45em; border-radius: 50%; background: var(--red); }
    .prizes { display: grid; gap: .55rem; }
    .pbtn {
      display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left; padding: .55rem .8rem; border-radius: .8rem;
      border: 2px solid var(--line); background: var(--soft); color: var(--ink); font-size: 1.15rem; font-weight: 900; cursor: pointer; line-height: 1.3;
    }
    .pbtn .ic { flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; display: grid; place-items: center; background: var(--yellow); border: 2px solid var(--ink); font-family: var(--font-en); font-size: .75em; }
    .pbtn:hover { border-color: var(--ink); }
    .pbtn.on { background: var(--yellow); border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
    .pbtn.on .ic { background: var(--red); color: #fff; }
    .hint { margin: .5rem 0 0; font-size: .75rem; color: var(--muted); }

    ol.winners { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; max-height: 34vh; overflow: auto; }
    ol.winners li { background: var(--soft); border: 1px solid var(--line); border-radius: .7rem; padding: .35rem .6rem; display: grid; grid-template-columns: auto 1fr auto; gap: .5rem; align-items: center; }
    ol.winners .no { font-family: var(--font-en); font-weight: 800; color: var(--red); min-width: 1.4em; font-size: 1rem; }
    ol.winners .nm { font-weight: 900; font-size: 1.1rem; }
    ol.winners .sub { display: block; font-size: .7rem; color: var(--muted); font-weight: 500; }
    ol.winners .pz { display: inline-block; font-size: .7rem; background: var(--yellow); border-radius: 6px; padding: 0 .4em; margin-left: .4em; font-weight: 700; vertical-align: .15em; }
    ol.winners li.absent .nm { text-decoration: line-through; opacity: .5; }
    ol.winners li.absent .no { color: var(--muted); }
    ol.winners .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1.1rem; min-width: 32px; min-height: 32px; border-radius: 8px; }
    ol.winners .x:hover { color: var(--ink); background: rgba(0,0,0,.06); }
    .empty { color: var(--muted); font-size: .85rem; margin: 0; }

    .ticker {
      min-height: 2.8rem; width: 100%; display: flex; align-items: center; justify-content: center; text-align: center;
      font-size: 2.3rem; font-weight: 900; letter-spacing: .06em; color: var(--red); line-height: 1.2;
    }
    .ticker.idle { color: var(--ink-2); font-size: 1.25rem; font-weight: 700; letter-spacing: .02em; }
    .ticker .pz { display: inline-block; font-size: .55em; background: var(--yellow); color: var(--ink); border: 2px solid var(--ink); border-radius: .5em; padding: 0 .5em; margin-right: .4em; vertical-align: .2em; letter-spacing: 0; }

    /* ---------- capsule machine ---------- */
    .machine { position: relative; width: min(100%, 34rem, calc((100vh - 13rem) * .68)); min-width: 220px; aspect-ratio: 380 / 560; user-select: none; }
    .globe {
      position: absolute; left: 3%; top: 0; width: 94%; aspect-ratio: 1; border-radius: 50%; overflow: hidden;
      background: radial-gradient(circle at 32% 28%, #fff 0, #F3F8FF 20%, #DCE8FB 60%, #BFD2F2 100%);
      border: 5px solid var(--ink); box-shadow: inset 0 -18px 40px rgba(33,60,143,.18), 0 10px 30px rgba(0,0,0,.12);
      z-index: 2;
    }
    .globe::after { /* glass highlight */
      content: ""; position: absolute; left: 14%; top: 9%; width: 26%; height: 14%; border-radius: 50%;
      background: rgba(255,255,255,.75); filter: blur(4px); transform: rotate(-30deg); pointer-events: none; z-index: 5;
    }
    .ball {
      position: absolute; width: 16%; aspect-ratio: 1; border-radius: 50%; border: 4px solid var(--ink); overflow: hidden;
      background: linear-gradient(to bottom, var(--c) 0 50%, #fff 50% 100%); will-change: transform;
    }
    .ball::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - 1.5px); height: 3px; background: var(--ink); }
    .ball::before { content: ""; position: absolute; left: 18%; top: 12%; width: 28%; height: 20%; border-radius: 50%; background: rgba(255,255,255,.55); }

    .neck { position: absolute; left: 30%; width: 40%; top: 60%; height: 10%; background: var(--yellow); border: 5px solid var(--ink); border-radius: 10px; z-index: 1; }
    .body {
      position: absolute; left: 0; right: 0; top: 66%; bottom: 4%; background: var(--red); border: 5px solid var(--ink); border-radius: 28px 28px 22px 22px;
      box-shadow: 8px 8px 0 var(--ink); z-index: 3; overflow: hidden;
    }
    .body::before { content: ""; position: absolute; left: -20%; top: -60%; width: 60%; height: 120%; border-radius: 50%; background: rgba(255,255,255,.14); }
    .label {
      position: absolute; left: 8%; top: 12%; padding: 2px 10px; border-radius: 8px; background: var(--yellow); color: var(--ink);
      border: 3px solid var(--ink); font-family: var(--font-en); font-weight: 800; font-size: .8rem; letter-spacing: .1em;
    }
    .crank {
      position: absolute; right: 12%; top: 14%; width: 26%; aspect-ratio: 1; border-radius: 50%; background: #fff; border: 5px solid var(--ink);
      transition: transform 2.4s cubic-bezier(.3,.1,.2,1);
    }
    .crank::before { content: ""; position: absolute; left: -12%; right: -12%; top: 38%; height: 24%; border-radius: 99px; background: var(--orange); border: 4px solid var(--ink); }
    .crank::after { content: ""; position: absolute; left: 38%; top: 38%; width: 24%; height: 24%; border-radius: 50%; background: var(--ink); }
    .chute {
      position: absolute; left: 10%; bottom: 12%; width: 34%; height: 34%; border-radius: 16px 16px 8px 8px; background: #3A0F02;
      border: 5px solid var(--ink); box-shadow: inset 0 8px 0 rgba(0,0,0,.4);
    }
    .feet { position: absolute; left: 6%; right: 6%; bottom: 0; height: 6%; display: flex; justify-content: space-between; z-index: 2; }
    .feet i { width: 18%; background: var(--ink); border-radius: 0 0 10px 10px; }
    .drop { position: absolute; left: 15%; bottom: 13%; width: 18%; aspect-ratio: 1; z-index: 4; opacity: 0; }
    .drop .ball { width: 100%; left: 0; top: 0; }

    .go {
      position: relative; min-width: 11em; min-height: 3.2rem; padding: .3rem 1.6rem; border-radius: 999px; border: 4px solid var(--ink);
      background: var(--orange); color: var(--ink); font-size: 1.6rem; font-weight: 900; letter-spacing: .15em; cursor: pointer;
      box-shadow: 5px 5px 0 var(--ink); transition: transform .12s, box-shadow .12s, background .2s;
    }
    .go:hover { background: var(--yellow); }
    .go:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
    .go[disabled] { opacity: .5; cursor: not-allowed; transform: none; box-shadow: 5px 5px 0 var(--ink); }
    .msg { color: var(--red); font-weight: 700; margin: 0; text-align: center; font-size: .9rem; }
    .msg:empty { display: none; }

    /* 窄螢幕改成上下排列：抽獎機在最上面 */
    @media (max-width: 900px) {
      html { font-size: 16px; }
      .stage { grid-template-columns: 1fr; }
      .center { order: -1; }
      .machine { width: min(82vw, 360px); }
      .stat .num { font-size: 3rem; }
    }

    /* ---------- reveal overlay ---------- */
    .overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(255,246,229,.86); backdrop-filter: blur(5px); }
    .big { position: absolute; left: 50%; top: 50%; width: min(14rem, 64vw); aspect-ratio: 1; margin: calc(min(14rem, 64vw) / -2) 0 0 calc(min(14rem, 64vw) / -2); }
    .half { position: absolute; left: 0; width: 100%; height: 50%; border: 6px solid var(--ink); }
    .half.t { top: 0; border-radius: 999px 999px 0 0; border-bottom-width: 3px; background: var(--c, var(--orange)); transform-origin: 8% 100%; }
    .half.b { bottom: 0; border-radius: 0 0 999px 999px; border-top-width: 3px; background: #fff; }
    .half.t::before { content: ""; position: absolute; left: 16%; top: 18%; width: 26%; height: 24%; border-radius: 50%; background: rgba(255,255,255,.5); }
    .card {
      position: relative; z-index: 2; width: min(34rem, 100%); background: #fff; color: var(--ink); border: 4px solid var(--ink); border-radius: 1.5rem;
      box-shadow: 12px 12px 0 var(--orange); padding: 2rem 1.6rem; text-align: center;
    }
    .card .kicker { font-weight: 900; letter-spacing: .3em; color: var(--red); font-size: 1.4rem; }
    .card .pzt { display: inline-block; margin-top: .5rem; background: var(--yellow); border: 3px solid var(--ink); border-radius: .6rem; padding: .1rem .8rem; font-weight: 900; font-size: 1.4rem; }
    .card .who { font-size: clamp(3rem, 5.5rem, 22vw); font-weight: 900; line-height: 1.15; margin: .8rem 0 .4rem; letter-spacing: .08em; word-break: break-word; }
    .card .meta { color: var(--ink-2); font-size: 1.35rem; font-weight: 700; margin: 0 0 1.3rem; }
    .card .btns { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
    .rbtn { min-height: 52px; padding: .3rem 1.2rem; border-radius: 999px; border: 3px solid var(--ink); font-weight: 900; font-size: 1.05rem; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); background: #fff; color: var(--ink); }
    .rbtn.primary { background: var(--red); color: #fff; }
    .rbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

    @keyframes shake { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-10deg); } 40% { transform: rotate(9deg); } 60% { transform: rotate(-7deg); } 80% { transform: rotate(5deg); } }
    .machine.shaking .globe { animation: shake .35s ease-in-out 5; }
  </style>
</head>
<body>
  <header class="top">
    <h1>奇美醫院 PGY 說明會・現場抽獎</h1>
    <div class="tools" id="tools" hidden>
      <span class="chip" id="updated"></span>
      <span class="chip hint" id="audioHint">點一下畫面開始播放音樂</span>
      <button class="tbtn" id="bgm" type="button" aria-pressed="true">🎵 音樂：開</button>
      <button class="tbtn" id="sfx" type="button" aria-pressed="true">🔊 音效：開</button>
      <button class="tbtn" id="fs" type="button">全螢幕</button>
      <button class="tbtn" id="logout" type="button">登出</button>
    </div>
  </header>

  <section class="login" id="login" hidden>
    <form id="loginForm" autocomplete="off">
      <h2>抽獎系統登入</h2>
      <input id="pw" type="password" placeholder="密碼" aria-label="密碼" autocomplete="current-password">
      <button id="loginBtn" type="submit">進入抽獎</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>
  </section>

  <div class="stage" id="stage" hidden>
    <!-- 左：人數 -->
    <section class="col">
      <div class="stats">
      <div class="panel stat">
        <div class="lbl">目前總報到人數</div>
        <div class="num"><span id="sIn">0</span><small>人</small></div>
      </div>
      <div class="panel stat alt">
        <div class="lbl">13:30 前報到人數</div>
        <div class="num"><span id="sEarly">0</span><small>人</small></div>
      </div>
      </div>
      <p class="substat">已中獎 <b id="sWin">0</b> 人・尚可抽 <b id="sPool">0</b> 人</p>
      <div class="panel">
        <h2>中獎名單 <button class="tbtn" id="clear" type="button">清空</button></h2>
        <ol class="winners" id="winners"></ol>
        <p class="empty" id="noWin">尚未抽出得獎者</p>
      </div>
    </section>

    <!-- 中：抽獎機 -->
    <section class="col center">
      <div class="ticker idle" id="ticker" aria-live="polite">按下「開始抽獎」轉動扭蛋機</div>
      <div class="machine" id="machine" aria-hidden="true">
        <div class="globe" id="globe"></div>
        <div class="neck"></div>
        <div class="body">
          <span class="label">PGY 116</span>
          <div class="crank" id="crank"></div>
          <div class="chute"></div>
        </div>
        <div class="drop" id="drop"><div class="ball" id="dropBall"></div></div>
        <div class="feet"><i></i><i></i></div>
      </div>
      <button class="go" id="go" type="button">開始抽獎</button>
      <p class="msg" id="msg" role="status"></p>
    </section>

    <!-- 右：規則與獎品 -->
    <section class="col">
      <div class="panel">
        <h2>抽籤規則</h2>
        <ul class="rules">
          <li>11/29(日)13:30 前報到者</li>
          <li>已經中獎的人不會再被抽到</li>
        </ul>
      </div>
      <div class="panel">
        <h2>抽獎品</h2>
        <div class="prizes" id="prizes">
          <button class="pbtn" type="button" data-prize="iPad Wi-Fi 機型 128GB"><span class="ic">1</span>iPad Wi-Fi 機型 128GB</button>
          <button class="pbtn" type="button" data-prize="Apple Watch SE 3"><span class="ic">2</span>Apple Watch SE 3</button>
          <button class="pbtn" type="button" data-prize="AirPods 5"><span class="ic">3</span>AirPods 5</button>
        </div>
        <p class="hint">點選獎品，設定這一輪要抽的獎項（會記在中獎名單上）</p>
      </div>
    </section>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="big" id="big"><div class="half t" id="bigTop"></div><div class="half b"></div></div>
    <div class="card" id="card" hidden>
      <div class="kicker">恭喜獲得</div>
      <div class="pzt" id="rPrize" hidden></div>
      <div class="who" id="rName"></div>
      <p class="meta" id="rMeta"></p>
      <div class="btns">
        <button class="rbtn primary" id="ok" type="button">恭喜！繼續抽獎</button>
        <button class="rbtn" id="absent" type="button">不在現場，重抽</button>
      </div>
    </div>
  </div>
  <canvas id="confetti" hidden></canvas>

<script>
(function () {
  'use strict';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzPsGT_RZx5qVH4miexVhbPE8MDkn8atbIsWqJs8sDxiihiHGeOj32VxEzeo6YRsof7/exec';
  var CUTOFF = new Date('2026-11-29T13:30:00+08:00'); // 抽獎資格：此時間前報到
  var KEY_STORE = 'pgy116-dash-key';          // 與儀表板共用（sessionStorage）
  var WIN_STORE = 'pgy116-draw-winners';      // 中獎紀錄（localStorage，重新整理也不會消失）
  var PRIZE_STORE = 'pgy116-draw-prize';
  var COLORS = ['#FFA319', '#F2541B', '#FFC83D', '#1E9E5A', '#3B82F6', '#A855F7', '#EC4899', '#14B8A6'];
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var $ = function (id) { return document.getElementById(id); };
  var people = [];      // 已報到者
  var winners = loadWinners();
  var prize = '';
  var spinning = false, current = null, autoTimer = null;

  function sGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function sSet(k, v) { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
  function loadWinners() { try { return JSON.parse(localStorage.getItem(WIN_STORE)) || []; } catch (e) { return []; } }
  function saveWinners() { try { localStorage.setItem(WIN_STORE, JSON.stringify(winners)); } catch (e) {} }
  function idOf(r) { return String(r.name).trim() + '|' + String(r.email).trim().toLowerCase(); }
  function rand(n) { // 均勻亂數 0..n-1
    if (window.crypto && crypto.getRandomValues) {
      var a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n;
      do { crypto.getRandomValues(a); } while (a[0] >= lim);

    return Math.floor(Math.random() * n);
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, REDUCED ? Math.min(ms, 150) : ms); }); }

  /* ---------- data ---------- */
  function fetchRows(key) {
    return fetch(GAS_URL, { method: 'POST', body: new URLSearchParams({ action: 'list', key: key }) })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (!res || !res.ok) throw new Error((res && res.error) || '讀取失敗'); return res; });
  }
  function setPeople(res) {
    people = res.rows.filter(function (r) { return r.checkin; }).map(function (r) {
      var t = new Date(r.checkin);
      return { id: idOf(r), name: String(r.name).trim(), school: r.school || '', program: r.program || '',
               early: !isNaN(t) && t < CUTOFF };
    });
    $('updated').textContent = '';
    render();
  }
  function refresh(silent) {
    var key = sGet(KEY_STORE);
    if (!key) return showLogin();
    if (spinning) return;
    return fetchRows(key).then(setPeople).catch(function (err) {
      if (/密碼/.test(err.message)) { sSet(KEY_STORE, null); showLogin(err.message); }
      else $('updated').textContent = '名單更新失敗：' + (err.message === 'Failed to fetch' ? '網路連線異常' : err.message);
    });
  }

  // 抽獎池：13:30 前報到、且還沒中獎（含標記不在現場）的人
  function pool() {
    var taken = {};
    winners.forEach(function (w) { taken[w.id] = 1; });
    return people.filter(function (p) { return p.early && !taken[p.id]; });
  }

  /* ---------- views ---------- */
  function showLogin(msg) {

    $('stage').hidden = true; $('tools').hidden = true; $('login').hidden = false;
    $('loginErr').textContent = msg || ''; $('pw').value = ''; $('pw').focus();
  }
  function showStage() {
    $('login').hidden = true; $('stage').hidden = false; $('tools').hidden = false;
    clearInterval(autoTimer);
    autoTimer = setInterval(function () { refresh(true); }, 60000); // 每分鐘自動補進新報到者
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var key = $('pw').value.trim();
    if (!key) return;
    $('loginBtn').disabled = true; $('loginErr').textContent = '';
    fetchRows(key).then(function (res) {
      sSet(KEY_STORE, key); showStage(); setPeople(res);
    }).catch(function (err) {
      $('loginErr').textContent = err.message === 'Failed to fetch' ? '網路連線異常，請稍後再試' : err.message;
    }).then(function () { $('loginBtn').disabled = false; });
  });
  $('logout').addEventListener('click', function () { sSet(KEY_STORE, null); people = []; showLogin(); });
  $('fs').addEventListener('click', function () {

    else d.documentElement.requestFullscreen && d.documentElement.requestFullscreen().catch(function () {});
  });
  $('clear').addEventListener('click', function () {
    if (!winners.length || spinning) return;
    if (!confirm('確定要清空全部中獎名單？清空後所有人都會重新回到抽獎池。')) return;
    winners = []; saveWinners(); render();
  });

  /* ---------- prizes ---------- */
  function setPrize(v) {
    prize = v || '';
    try { localStorage.setItem(PRIZE_STORE, prize); } catch (e) {}
    Array.prototype.forEach.call(document.querySelectorAll('.pbtn'), function (b) {
      var on = b.getAttribute('data-prize') === prize;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    if (!spinning) idleTicker();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.pbtn'), function (b) {
    b.addEventListener('click', function () {
      if (spinning) return;
      var v = b.getAttribute('data-prize');
      setPrize(prize === v ? '' : v);

  });
  function idleTicker(text) {

    t.appendChild(document.createTextNode(text || '按下「開始抽獎」轉動扭蛋機'));
  }

  /* ---------- render ---------- */
  function render() {
    var p = pool();
    $('sIn').textContent = people.length;
    $('sEarly').textContent = people.filter(function (x) { return x.early; }).length;
    $('sPool').textContent = p.length;
    $('sWin').textContent = winners.filter(function (w) { return !w.absent; }).length;
    $('go').disabled = spinning || !p.length;
    $('msg').textContent = !people.length ? '目前還沒有人報到' :
                           !p.length ? '沒有符合資格、尚未中獎的人了' : '';
    var ol = $('winners'); ol.textContent = '';
    var n = 0;
    winners.forEach(function (w, i) {
      var li = document.createElement('li');
      if (w.absent) li.className = 'absent'; else n++;
      var no = document.createElement('span'); no.className = 'no'; no.textContent = w.absent ? '—' : n;
      var box = document.createElement('div');
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = w.name;
      box.appendChild(nm);
      if (w.prize && !w.absent) { var pz = document.createElement('span'); pz.className = 'pz'; pz.textContent = w.prize; box.appendChild(pz); }
      var sub = document.createElement('span'); sub.className = 'sub';
      sub.textContent = (w.absent ? '不在現場・' : '') + [w.school, w.program].filter(Boolean).join('・');
      box.appendChild(sub);
      var x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.textContent = '×';
      x.title = '移除（放回抽獎池）'; x.setAttribute('aria-label', '移除 ' + w.name);
      x.addEventListener('click', function () {
        if (spinning) return;
        if (!confirm('把「' + w.name + '」從名單移除，放回抽獎池？')) return;
        winners.splice(i, 1); saveWinners(); render();
      });
      li.appendChild(no); li.appendChild(box); li.appendChild(x);
      ol.appendChild(li);
    });
    $('noWin').hidden = winners.length > 0;
  }

  /* ---------- machine ---------- */
  var balls = [];
  // 在球體下半部用蜂巢排列堆扭蛋（約 20 顆）
  function buildBalls() {
    var g = $('globe'), size = 16, R = 39, i = 0;
    for (var row = 0; row < 7; row++) {
      var cy = 80 - row * 13, dy = Math.abs(cy - 50);
      if (dy > R || cy < 26) continue;
      var maxDx = Math.sqrt(R * R - dy * dy), off = row % 2 ? 7.5 : 0;
      for (var k = -4; k <= 4; k++) {
        var cx = 50 + off + k * 15;
        if (Math.abs(cx - 50) > maxDx) continue;
        var el = document.createElement('div');
        el.className = 'ball';
        el.style.setProperty('--c', COLORS[(i * 5 + row) % COLORS.length]);
        el.style.left = (cx - size / 2 + (rand(3) - 1)) + '%';
        el.style.top = (cy - size / 2 + (rand(3) - 1)) + '%';
        el.style.transform = 'rotate(' + rand(360) + 'deg)';
        g.appendChild(el);
        balls.push({ el: el });
        i++;
      }
    }
  }

  function jumble(ms) {
    if (REDUCED || !balls[0] || !balls[0].el.animate) return;
    balls.forEach(function (b) {
      var frames = [{ transform: b.el.style.transform }];
      for (var k = 0; k < 7; k++) {
        var dx = rand(180) - 90, dy = -(rand(360) + 40);
        frames.push({ transform: 'translate(' + dx + '%,' + dy + '%) rotate(' + rand(720) + 'deg)' });
      }
      frames.push({ transform: 'rotate(' + rand(360) + 'deg)' });
      var a = b.el.animate(frames, { duration: ms, easing: 'ease-in-out' });
      a.onfinish = function () { b.el.style.transform = frames[frames.length - 1].transform; };
    });
  }

  function runTicker(names, ms) {
    var t = $('ticker'); t.classList.remove('idle');
    var start = performance.now();
    return new Promise(function (resolve) {
      (function step() {
        var e = performance.now() - start;
        if (e >= ms) return resolve();
        t.textContent = names[rand(names.length)];
        Sound.tick(e / ms);
        setTimeout(step, 50 + Math.pow(e / ms, 2.2) * 260); // 越來越慢
      })();
    });
  }

  var crankDeg = 0;
  function draw() {
    if (spinning) return;
    var p = pool();
    if (!p.length) return;
    spinning = true; render();
    var pick = p[rand(p.length)];
    var color = COLORS[rand(COLORS.length)];
    current = { id: pick.id, name: pick.name, school: pick.school, program: pick.program, prize: prize, color: color };

    Sound.duck(true); Sound.crank(); Sound.rattle(2.4); Sound.drumroll(REDUCED ? 0.3 : 2.6);
    crankDeg += 720;
    $('crank').style.transform = 'rotate(' + crankDeg + 'deg)';
    $('machine').classList.add('shaking');
    jumble(2400);
    runTicker(p.map(function (x) { return x.name; }), REDUCED ? 200 : 2600).then(function () {
      $('ticker').textContent = '？？？';
      $('machine').classList.remove('shaking');
      var drop = $('drop');
      $('dropBall').style.setProperty('--c', color);
      if (drop.animate && !REDUCED) {
        drop.animate([
          { opacity: 0, transform: 'translate(0,-60%) scale(.6)' },
          { opacity: 1, transform: 'translate(0,0) scale(1)', offset: .35 },
          { opacity: 1, transform: 'translate(40%,140%) scale(1.1)', offset: .7 },
          { opacity: 1, transform: 'translate(55%,110%) scale(1.1)', offset: .85 },
          { opacity: 1, transform: 'translate(60%,140%) scale(1.1)' }
        ], { duration: 900, easing: 'ease-in', fill: 'forwards' });
        Sound.thunk(0.6); Sound.thunk(0.8, 0.5); Sound.thunk(0.9, 0.3);
      } else Sound.thunk(0);
      return wait(950);
    }).then(reveal);
  }

  function reveal() {
    var o = $('overlay'), big = $('big'), top = $('bigTop'), card = $('card');
    // 清掉上一輪留下的動畫（淡出、蓋子打開都有 fill:forwards，不清掉第二次起扭蛋會看不到）
    [$('drop'), big, top, card].forEach(function (el) {
      if (el.getAnimations) el.getAnimations().forEach(function (a) { a.cancel(); });
    });
    top.style.setProperty('--c', current.color);
    top.style.transform = ''; big.style.opacity = '1'; big.hidden = false; card.hidden = true;
    o.hidden = false;
    var anim = big.animate && !REDUCED;
    Sound.whoosh();
    if (anim) big.animate([{ transform: 'scale(.2) translateY(60%)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 500, easing: 'ease-out' });
    wait(550).then(function () {
      Sound.rattle(0.7, 0.6);
      if (anim) big.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-8deg)' }, { transform: 'rotate(8deg)' }, { transform: 'rotate(-5deg)' }, { transform: 'rotate(0)' }], { duration: 700 });
      return wait(750);
    }).then(function () {
      Sound.pop();
      if (anim) top.animate([{ transform: 'rotate(0)' }, { transform: 'translateY(-30%) rotate(-75deg)' }], { duration: 350, fill: 'forwards', easing: 'ease-out' });
      return wait(300);
    }).then(function () {
      if (anim) big.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
      $('rName').textContent = current.name;
      $('rMeta').textContent = [current.school, current.program].filter(Boolean).join('・');
      $('rPrize').textContent = current.prize; $('rPrize').hidden = !current.prize;
      card.hidden = false;
      if (card.animate && !REDUCED) card.animate([{ transform: 'scale(.3)', opacity: 0 }, { transform: 'scale(1.06)', opacity: 1 }, { transform: 'scale(1)' }], { duration: 450, easing: 'cubic-bezier(.2,1.4,.4,1)' });
      $('ticker').textContent = '🎉 ' + current.name;
      // 先記錄，避免中途重新整理而遺失
      winners.push({ id: current.id, name: current.name, school: current.school, program: current.program, prize: current.prize, time: new Date().toISOString() });
      saveWinners();
      confetti();
      Sound.fanfare();
      setTimeout(function () { big.hidden = true; $('ok').focus(); }, 320);
    });
  }

  function closeReveal(absent) {
    if (!current) return;
    if (absent) {
      var w = winners[winners.length - 1];
      if (w && w.id === current.id) { w.absent = true; saveWinners(); }
    }
    $('overlay').hidden = true; $('drop').style.opacity = '0';
    stopConfetti();
    spinning = false; current = null;
    var redraw = absent && pool().length > 0;   // 沒有人可抽時不重抽
    if (!redraw) Sound.duck(false);
    idleTicker(redraw ? '重新抽獎中…' : '');
    render();
    if (redraw) setTimeout(draw, 400); else $('go').focus();
  }
  $('ok').addEventListener('click', function () { closeReveal(false); });
  $('absent').addEventListener('click', function () { closeReveal(true); });
  $('go').addEventListener('click', draw);
  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if ($('stage').hidden) return;
    if (!$('overlay').hidden) { if (e.key === 'Escape' && !$('card').hidden) { e.preventDefault(); closeReveal(false); } return; }
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); draw(); }
  });

  /* ---------- confetti ---------- */
  var cv = $('confetti'), ctx = cv.getContext('2d'), parts = [], raf = 0;
  function confetti() {
    if (REDUCED) return;
    cv.hidden = false;
    var dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    parts = [];
    for (var i = 0; i < 200; i++) {
      var side = i % 2 ? 1 : -1;
      parts.push({
        x: side < 0 ? 0 : innerWidth, y: innerHeight * 0.7,
        vx: -side * (4 + Math.random() * 9), vy: -(9 + Math.random() * 12),
        w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
        c: COLORS[i % COLORS.length]
      });
    }
    var start = performance.now();
    cancelAnimationFrame(raf);
    (function tick(t) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach(function (p) {
        p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });
      if (t - start < 4500) raf = requestAnimationFrame(tick); else stopConfetti();
    })(start);
  }
  function stopConfetti() { cancelAnimationFrame(raf); ctx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }

  /* ---------- sound：全部用 Web Audio 即時合成，不需要音檔 ---------- */
  var Sound = (function () {
    var AC = window.AudioContext || window.webkitAudioContext;
    var ac = null, master, musicBus, sfxBus, noiseBuf, timer = null, nextT = 0, step = 0, ducked = false;
    var MUSIC_VOL = 0.24, DUCK_VOL = 0.06, SFX_VOL = 0.85;
    var E8 = 60 / 116 / 2;   // 116 BPM 的八分音符
    function pref(k) { try { return localStorage.getItem(k) !== '0'; } catch (e) { return true; } }
    function savePref(k, v) { try { localStorage.setItem(k, v ? '1' : '0'); } catch (e) {} }
    var musicOn = pref('pgy116-draw-music'), sfxOn = pref('pgy116-draw-sfx');
    function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

    function init() {
      if (ac) return true;
      if (!AC) return false;
      try { ac = new AC(); } catch (e) { return false; }
      var comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
      master = ac.createGain(); master.gain.value = 0.9; master.connect(comp);
      musicBus = ac.createGain(); musicBus.gain.value = musicOn ? MUSIC_VOL : 0; musicBus.connect(master);
      sfxBus = ac.createGain(); sfxBus.gain.value = sfxOn ? SFX_VOL : 0; sfxBus.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return true;
    }
    function ready() { return ac && ac.state === 'running'; }
    function now(delay) { return ac.currentTime + (delay || 0) + 0.01; }

    /* --- 基本音色 --- */
    function tone(bus, t, f, dur, type, vol, attack, f2) {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'triangle';
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.005));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.05);
    }
    function bell(bus, t, f, dur, vol) { tone(bus, t, f, dur, 'sine', vol); tone(bus, t, f * 2, dur * 0.6, 'sine', vol * 0.3); }
    function noise(bus, t, dur, vol, type, freq, q, freq2) {
      var s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noiseBuf; f.type = type || 'highpass'; f.frequency.setValueAtTime(freq || 6000, t);

      if (q) f.Q.value = q;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(bus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }
    function brass(t, f, dur, vol) {

      f1.type = 'lowpass'; f1.frequency.setValueAtTime(700, t); f1.frequency.exponentialRampToValueAtTime(3200, t + 0.06);
      f1.frequency.exponentialRampToValueAtTime(1600, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
      g.gain.setValueAtTime(vol, t + Math.max(0.04, dur - 0.12)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

        o.connect(f1); o.start(t); o.stop(t + dur + 0.05);
      });
      f1.connect(g); g.connect(sfxBus);
    }

    /* --- 背景音樂：輕快的八小節循環（C–G–Am–F–C–G–F–G） --- */
    var CH = [[60,64,67,72],[59,62,67,71],[57,60,64,69],[57,60,65,69],[60,64,67,72],[59,62,67,71],[57,60,65,69],[59,62,67,71]];
    var BASS = [36, 43, 45, 41, 36, 43, 41, 43];
    var ARP = [0, 2, 1, 3, 2, 3, 1, 2];
    var MEL = [76,0,79,76, 74,0,71,74, 72,0,76,72, 72,74,77,0, 79,0,76,79, 79,77,74,0, 72,74,77,81, 79,0,0,0];
    function musicStep(t, s) {
      var bar = Math.floor(s / 8) % 8, e = s % 8, ch = CH[bar];
      bell(musicBus, t, hz(ch[ARP[e]] + 12), 0.45, 0.09);                       // 音樂盒琶音
      if (e % 2 === 1) noise(musicBus, t, 0.04, 0.05, 'highpass', 8000);          // 沙鈴
      if (e === 0 || e === 4) {
        tone(musicBus, t, hz(BASS[bar]), 0.5, 'triangle', 0.32, 0.01);            // 低音
        tone(musicBus, t, 140, 0.16, 'sine', 0.35, 0.003, 45);                    // 輕鼓
      }
      if (e === 2 || e === 6) noise(musicBus, t, 0.09, 0.07, 'bandpass', 1800, 0.8); // 拍手感
      if (e % 2 === 0) { var m = MEL[bar * 4 + e / 2]; if (m) tone(musicBus, t, hz(m), E8 * 1.9, 'triangle', 0.16, 0.01); }
    }
    function startMusic() {
      if (!ac || timer) return;
      nextT = ac.currentTime + 0.1;
      timer = setInterval(function () {
        if (nextT < ac.currentTime - 0.05) nextT = ac.currentTime + 0.05;          // 分頁在背景時不補播
        while (nextT < ac.currentTime + 0.2) { musicStep(nextT, step); step++; nextT += E8; }

    }
    function stopMusic() { clearInterval(timer); timer = null; }
    function musicLevel() { return musicOn ? (ducked ? DUCK_VOL : MUSIC_VOL) : 0; }
    function fadeMusic(sec) {
      if (!ac) return;
      var g = musicBus.gain, t = ac.currentTime;
      g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(musicLevel(), t + (sec || 0.4));
    }

    return {
      unlock: function () {
        if (!init()) return;
        var go = function () { if (musicOn) startMusic(); updateHint(); };
        if (ac.state === 'suspended') ac.resume().then(go, function () {}); else go();
      },
      running: function () { return ready(); },
      music: function (v) {
        if (v === undefined) return musicOn;
        musicOn = v; savePref('pgy116-draw-music', v);
        if (!ac) return v;
        fadeMusic(0.3);
        if (v) startMusic(); else setTimeout(function () { if (!musicOn) stopMusic(); }, 400);
        return v;
      },
      sfx: function (v) {
        if (v === undefined) return sfxOn;
        sfxOn = v; savePref('pgy116-draw-sfx', v);
        if (ac) sfxBus.gain.setValueAtTime(v ? SFX_VOL : 0, ac.currentTime);
        return v;
      },
      duck: function (on) { ducked = on; fadeMusic(on ? 0.3 : 1.2); },

      /* --- 轉動時 --- */
      tick: function (p) {             // 名字跳動：越來越慢的「喀」
        if (!ready()) return; var t = now();
        tone(sfxBus, t, 2300 - p * 900, 0.035, 'square', 0.07);
        noise(sfxBus, t, 0.025, 0.18, 'highpass', 3500);
      },
      crank: function () {             // 轉把手的棘輪聲
        if (!ready()) return;
        for (var i = 0; i < 14; i++) noise(sfxBus, now(i * 0.085 + i * i * 0.004), 0.03, 0.35, 'bandpass', 1300, 3);
      },
      rattle: function (sec, vol) {    // 扭蛋在球體裡碰撞
        if (!ready()) return; vol = vol || 1;
        var n = Math.round(sec * 22);
        for (var i = 0; i < n; i++) {
          var t = now(Math.random() * sec);
          noise(sfxBus, t, 0.03 + Math.random() * 0.04, (0.08 + Math.random() * 0.16) * vol, 'bandpass', 2200 + Math.random() * 2600, 6);
          if (Math.random() < 0.4) tone(sfxBus, t, 700 + Math.random() * 900, 0.05, 'sine', 0.06 * vol);
        }
      },
      drumroll: function (sec) {       // 小鼓滾奏，越來越大聲
        if (!ready()) return;
        for (var x = 0; x < sec; x += 0.045) noise(sfxBus, now(x), 0.06, 0.04 + 0.28 * Math.pow(x / sec, 1.6), 'highpass', 1600);
      },
      thunk: function (delay, vol) {   // 扭蛋掉出來
        if (!ready()) return; var t = now(delay); vol = vol || 1;
        tone(sfxBus, t, 230, 0.16, 'sine', 0.55 * vol, 0.003, 70);
        noise(sfxBus, t, 0.05, 0.25 * vol, 'lowpass', 900);
      },

      /* --- 開獎時 --- */
      whoosh: function () {
        if (!ready()) return;
        noise(sfxBus, now(), 0.45, 0.22, 'bandpass', 350, 1.2, 3200);
      },
      pop: function () {               // 扭蛋打開
        if (!ready()) return; var t = now();
        noise(sfxBus, t, 0.09, 0.6, 'highpass', 900);
        tone(sfxBus, t, 380, 0.12, 'sine', 0.35, 0.003, 1400);
      },
      fanfare: function () {           // 號角＋鈸＋亮晶晶
        if (!ready()) return; var t = now(), d = 0.11;
        [67, 72, 76].forEach(function (m, i) { brass(t + i * d, hz(m), d * 0.9, 0.16); });
        brass(t + 3 * d, hz(79), 0.32, 0.18);
        [72, 76, 79, 84].forEach(function (m) { brass(t + 3 * d + 0.34, hz(m), 1.5, 0.12); });
        tone(sfxBus, t + 3 * d + 0.34, hz(48), 1.4, 'triangle', 0.4, 0.01);
        noise(sfxBus, t + 3 * d + 0.34, 1.8, 0.28, 'highpass', 5000);
        tone(sfxBus, t + 3 * d + 0.34, 120, 0.3, 'sine', 0.6, 0.003, 40);
        var pent = [84, 86, 88, 91, 93, 96, 98, 100];
        for (var i = 0; i < 16; i++) bell(sfxBus, t + 0.5 + i * 0.09 + Math.random() * 0.05, hz(pent[Math.floor(Math.random() * pent.length)]), 0.5, 0.07);
      }
    };
  })();
  window.drawSound = Sound;   // 方便除錯

  function updateHint() { $('audioHint').hidden = Sound.running() || (!Sound.music() && !Sound.sfx()); }
  function updateAudioBtns() {
    var m = Sound.music(), x = Sound.sfx();
    $('bgm').textContent = '🎵 音樂：' + (m ? '開' : '關'); $('bgm').setAttribute('aria-pressed', m ? 'true' : 'false');
    $('sfx').textContent = '🔊 音效：' + (x ? '開' : '關'); $('sfx').setAttribute('aria-pressed', x ? 'true' : 'false');
    updateHint();
  }
  // 瀏覽器規定要先有一次點擊或按鍵才能出聲
  ['pointerdown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, Sound.unlock, true); });
  $('bgm').addEventListener('click', function () { Sound.music(!Sound.music()); updateAudioBtns(); });
  $('sfx').addEventListener('click', function () { Sound.sfx(!Sound.sfx()); updateAudioBtns(); });
  updateAudioBtns();

  /* ---------- start ---------- */
  buildBalls();
  try { setPrize(localStorage.getItem(PRIZE_STORE) || ''); } catch (e) { setPrize(''); }
  if (sGet(KEY_STORE)) { showStage(); refresh(false); } else showLogin();
})();
</script>
